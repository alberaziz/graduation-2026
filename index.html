<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class of 2026 - Graduation Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-[100dvh] w-full overflow-hidden select-none font-sans relative flex flex-col justify-between">

  <!-- فيديو الكاميرا المخفي -->
  <video id="video" autoplay playsinline muted class="hidden"></video>

  <!-- الشريط العلوي واختيار عدد اللقطات -->
  <div class="absolute top-0 inset-x-0 z-30 flex flex-col items-center pt-3 pb-5 bg-gradient-to-b from-black/90 to-transparent">
    <div class="w-full flex items-center justify-between px-5 mb-3 text-xs tracking-widest font-mono">
      <span class="text-amber-300 font-bold">CLASS OF 2026</span>
      
      <!-- زرار تغيير الاستيكر -->
      <button id="switchLogoBtn" class="px-3 py-1.5 rounded-full bg-black/80 border border-white/20 text-[11px] font-bold text-amber-300 active:scale-95 transition-all shadow-lg">
        ✨ Change Sticker
      </button>
    </div>

    <!-- أزرار تحديد عدد الصور -->
    <div class="flex items-center gap-1 bg-neutral-900/90 border border-white/15 p-1 rounded-full text-xs font-semibold">
      <button class="mode-btn px-3 py-1 rounded-full bg-amber-500 text-black" data-shots="1">1 Shot</button>
      <button class="mode-btn px-3 py-1 rounded-full text-neutral-400" data-shots="2">2 Shots</button>
      <button class="mode-btn px-3 py-1 rounded-full text-neutral-400" data-shots="3">3 Shots</button>
      <button class="mode-btn px-3 py-1 rounded-full text-neutral-400" data-shots="4">4 Shots</button>
    </div>
  </div>

  <div id="errorBox" class="hidden absolute top-20 inset-x-4 z-40 bg-red-900/90 border border-red-500 p-3 rounded-2xl text-center text-xs text-red-200"></div>

  <!-- مساحة الكاميرا والاستيكر اللايف -->
  <div class="relative w-full h-full overflow-hidden bg-neutral-950 flex items-center justify-center">
    <!-- كانفاس بث الكاميرا -->
    <canvas id="liveCameraCanvas" class="w-full h-full object-cover"></canvas>
    
    <!-- كانفاس الاستيكر اللايف -->
    <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
    
    <!-- تأثير الفلاش -->
    <div id="flashEffect" class="absolute inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-150 z-20"></div>
  </div>

  <!-- الشريط السفلي -->
  <div class="absolute bottom-0 inset-x-0 z-30 flex items-center justify-around px-5 pt-10 pb-8 bg-gradient-to-t from-black/95 via-black/50 to-transparent">
    
    <!-- مصغرة المعرض -->
    <div class="relative w-14 h-14 flex items-center justify-center">
      <button id="galleryThumbBtn" class="w-13 h-13 rounded-2xl border-2 border-white/40 overflow-hidden bg-neutral-900 active:scale-90 transition-transform">
        <img id="thumbImg" src="" class="hidden w-full h-full object-cover" alt="Gallery">
        <div id="emptyThumbIcon" class="text-xl text-neutral-500 flex items-center justify-center h-full">🖼️</div>
      </button>
      <span id="galleryBadge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-black px-1.5 py-0.5 rounded-full shadow">0</span>
    </div>

    <!-- زرار الالتقاط والعداد -->
    <div class="relative flex items-center justify-center">
      <button id="snapBtn" class="w-20 h-20 rounded-full border-4 border-amber-400 flex items-center justify-center bg-black active:scale-95 transition-all shadow-lg shadow-amber-500/20">
        <div class="w-14 h-14 rounded-full bg-amber-400 active:bg-amber-300"></div>
      </button>
      <span id="sessionCounter" class="absolute -top-3 bg-amber-400 text-black text-[11px] font-black px-2 py-0.5 rounded-full shadow">0/1</span>
    </div>

    <!-- زر قلب الكاميرا -->
    <div class="w-14 h-14 flex items-center justify-center">
      <button id="flipBtn" class="w-14 h-14 rounded-2xl bg-neutral-900/80 border border-white/20 flex items-center justify-center active:scale-90 transition-transform text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
  </div>

  <!-- المعرض -->
  <div id="galleryModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col justify-between p-4">
    <div class="w-full flex items-center justify-between pt-2 pb-4 border-b border-neutral-800">
      <button id="closeGalleryBtn" class="px-4 py-1.5 bg-neutral-900 rounded-full text-xs text-amber-300 font-bold border border-neutral-700 active:scale-95">
        Back
      </button>
      <span id="uploadStatus" class="text-emerald-400 text-xs font-bold opacity-0 transition-opacity">● Saved to Drive</span>
      <a id="downloadPhotoBtn" download="graduation-photobooth.jpg" class="px-5 py-1.5 bg-amber-500 hover:bg-amber-400 text-black rounded-full text-xs font-bold active:scale-95">
        Download
      </a>
    </div>
    <div class="relative flex-1 flex items-center justify-center p-2">
      <img id="galleryMainImg" class="max-w-full max-h-[72vh] object-contain rounded-2xl shadow-2xl border border-neutral-800" alt="Collage Strip">
    </div>
    <div class="w-full flex items-center justify-between px-6 pb-4">
      <button id="prevPhotoBtn" class="w-12 h-12 rounded-full bg-neutral-900 border border-neutral-700 text-lg flex items-center justify-center active:scale-90">❮</button>
      <span id="galleryCounter" class="text-[11px] text-neutral-500 font-mono">1 / 1</span>
      <button id="nextPhotoBtn" class="w-12 h-12 rounded-full bg-neutral-900 border border-neutral-700 text-lg flex items-center justify-center active:scale-90">❯</button>
    </div>
  </div>

  <canvas id="compositeCanvas" class="hidden"></canvas>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJqgbbH2UBN-KzefwQspwHAU-iIx-W0gbcBGafuoFNNdzqT5lTlV3-C1lp8KCjuIhH/exec";

    const video = document.getElementById('video');
    const liveCameraCanvas = document.getElementById('liveCameraCanvas');
    const liveCamCtx = liveCameraCanvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const canvas = document.getElementById('compositeCanvas');
    const ctx = canvas.getContext('2d');

    const snapBtn = document.getElementById('snapBtn');
    const flipBtn = document.getElementById('flipBtn');
    const switchLogoBtn = document.getElementById('switchLogoBtn');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const sessionCounter = document.getElementById('sessionCounter');
    const flashEffect = document.getElementById('flashEffect');
    const uploadStatus = document.getElementById('uploadStatus');

    const galleryThumbBtn = document.getElementById('galleryThumbBtn');
    const thumbImg = document.getElementById('thumbImg');
    const emptyThumbIcon = document.getElementById('emptyThumbIcon');
    const galleryBadge = document.getElementById('galleryBadge');
    const galleryModal = document.getElementById('galleryModal');
    const closeGalleryBtn = document.getElementById('closeGalleryBtn');
    const galleryMainImg = document.getElementById('galleryMainImg');
    const galleryCounter = document.getElementById('galleryCounter');
    const downloadPhotoBtn = document.getElementById('downloadPhotoBtn');
    const prevPhotoBtn = document.getElementById('prevPhotoBtn');
    const nextPhotoBtn = document.getElementById('nextPhotoBtn');

    let currentFacingMode = 'user';
    let targetShots = 1;
    let sessionShots = [];
    let savedCollages = [];
    let currentGalleryIndex = 0;

    // --- 1. إعدادات الاستيكرات الحية ---
    const stickerSources = ['logo1.png', 'logo2.png', 'logo3.png', 'logo4.png', 'logo5.png'];
    const loadedStickers = [];
    let activeStickerIdx = 0;

    stickerSources.forEach(src => {
      const img = new Image();
      img.src = src;
      loadedStickers.push(img);
    });

    switchLogoBtn.addEventListener('click', () => {
      activeStickerIdx = (activeStickerIdx + 1) % stickerSources.length;
    });

    // رسم الاستيكر في مكانه الصحيح (على الكانفاس)
    function drawSticker(tCtx, idx, targetW, targetH) {
      const sticker = loadedStickers[idx];
      if (!sticker || !sticker.complete || sticker.naturalWidth === 0) return;

      const aspect = sticker.naturalWidth / sticker.naturalHeight;
      let drawW, drawH, drawX, drawY;

      switch(idx) {
        case 0: // logo1: bottom center
          drawW = targetW * 0.45; drawH = drawW / aspect;
          drawX = (targetW - drawW) / 2; drawY = targetH - drawH - (targetH * 0.08);
          break;
        case 1: // logo2: right vertical
          drawH = targetH * 0.40; drawW = drawH * aspect;
          drawX = targetW - drawW - (targetW * 0.05); drawY = (targetH - drawH) / 2;
          break;
        case 2: // logo3: left bottom
          drawW = targetW * 0.42; drawH = drawW / aspect;
          drawX = targetW * 0.05; drawY = (targetH * 0.75) - (drawH / 2);
          break;
        case 3: // logo4: top center
          drawW = targetW * 0.65; drawH = drawW / aspect;
          drawX = (targetW - drawW) / 2; drawY = targetH * 0.05;
          break;
        case 4: // logo5: center bottom
          drawW = targetW * 0.58; drawH = drawW / aspect;
          drawX = (targetW - drawW) / 2; drawY = (targetH * 0.75) - (drawH / 2);
          break;
      }
      tCtx.drawImage(sticker, drawX, drawY, drawW, drawH);
    }

    // --- 2. إعدادات فريمات الكولاج (مركز cx,cy - حجم الشباك w,h - الدوران rot) ---
    // يمكنك تعديل الأرقام لضبط ميل الصور بدقة حسب تصميمات الفريمات التي رفعتها
    const FRAMES_CONFIG = {
      1: [
        { src: 'f1_1.png', slots: [{ cx: 540, cy: 960, w: 800, h: 900, rot: -2 }] },
        { src: 'f1_2.png', slots: [{ cx: 540, cy: 960, w: 800, h: 900, rot: 2 }] },
        { src: 'f1_3.png', slots: [{ cx: 540, cy: 960, w: 800, h: 900, rot: 0 }] }
      ],
      2: [
        { src: 'f2_1.png', slots: [
            { cx: 480, cy: 500, w: 700, h: 700, rot: -6 }, 
            { cx: 600, cy: 1350, w: 700, h: 700, rot: 8 }
        ]},
        { src: 'f2_2.png', slots: [
            { cx: 540, cy: 500, w: 750, h: 750, rot: 0 }, 
            { cx: 540, cy: 1350, w: 750, h: 750, rot: 0 }
        ]},
        { src: 'f2_3.png', slots: [
            { cx: 450, cy: 450, w: 650, h: 700, rot: -4 }, 
            { cx: 620, cy: 1350, w: 650, h: 700, rot: 5 }
        ]}
      ],
      3: [
        { src: 'f3_1.png', slots: [
            { cx: 540, cy: 400, w: 800, h: 480, rot: 0 },
            { cx: 540, cy: 950, w: 800, h: 480, rot: 0 },
            { cx: 540, cy: 1500, w: 800, h: 480, rot: 0 }
        ]},
        { src: 'f3_2.png', slots: [
            { cx: 520, cy: 420, w: 780, h: 480, rot: -2 },
            { cx: 560, cy: 960, w: 780, h: 480, rot: 2 },
            { cx: 520, cy: 1500, w: 780, h: 480, rot: -2 }
        ]}
      ],
      4: [
        { src: 'f4_1.png', slots: [
            { cx: 380, cy: 430, w: 450, h: 480, rot: -7 },   // Top Left
            { cx: 700, cy: 650, w: 450, h: 480, rot: 15 },   // Top Right
            { cx: 280, cy: 1400, w: 450, h: 480, rot: -5 },  // Bottom Left
            { cx: 720, cy: 1570, w: 450, h: 480, rot: 7 }    // Bottom Right
        ]},
        { src: 'f4_2.png', slots: [
            { cx: 280, cy: 480, w: 500, h: 900, rot: 0 },
            { cx: 800, cy: 480, w: 500, h: 900, rot: 0 },
            { cx: 280, cy: 1440, w: 500, h: 900, rot: 0 },
            { cx: 800, cy: 1440, w: 500, h: 900, rot: 0 }
        ]}
      ]
    };

    const loadedFrameImgs = {};
    Object.keys(FRAMES_CONFIG).forEach(count => {
      FRAMES_CONFIG[count].forEach(f => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = f.src;
        loadedFrameImgs[f.src] = img;
      });
    });

    // --- 3. اختيار عدد الصور (Modes) ---
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => {
          b.className = 'mode-btn px-3 py-1 rounded-full text-neutral-400';
        });
        btn.className = 'mode-btn px-3 py-1 rounded-full bg-amber-500 text-black';
        targetShots = parseInt(btn.dataset.shots);
        resetSession();
      });
    });

    function resetSession() {
      sessionShots = [];
      sessionCounter.textContent = `0/${targetShots}`;
      snapBtn.disabled = false;
    }

    // --- 4. تشغيل ورسم الكاميرا اللايف (بدون تشوه) ---
    async function startCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        document.getElementById('errorBox').classList.remove('hidden');
        document.getElementById('errorBox').textContent = 'Camera permission needed.';
      }
    }
    startCamera();

    flipBtn.addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      await startCamera();
    });

    // الدالة السحرية لرسم الكاميرا أو الصورة لتملا المربع بدون "مط" (Object-fit: Cover)
    function drawCoverImage(tCtx, source, dx, dy, dw, dh, isMirrored) {
      const sw = source.videoWidth || source.width;
      const sh = source.videoHeight || source.height;
      if (!sw || !sh) return;
      
      const sRatio = sw / sh;
      const dRatio = dw / dh;
      let sx, sy, sCropW, sCropH;

      if (sRatio > dRatio) {
        sCropH = sh;
        sCropW = sh * dRatio;
        sx = (sw - sCropW) / 2;
        sy = 0;
      } else {
        sCropW = sw;
        sCropH = sw / dRatio;
        sx = 0;
        sy = (sh - sCropH) / 2;
      }

      tCtx.save();
      if (isMirrored) {
        tCtx.translate(dx + dw, dy);
        tCtx.scale(-1, 1);
        tCtx.drawImage(source, sx, sy, sCropW, sCropH, 0, 0, dw, dh);
      } else {
        tCtx.drawImage(source, sx, sy, sCropW, sCropH, dx, dy, dw, dh);
      }
      tCtx.restore();
    }

    // حلقة عرض الكاميرا والاستيكر
    function renderLiveView() {
      if (video.readyState >= 2) {
        // رسم الكاميرا
        liveCameraCanvas.width = liveCameraCanvas.clientWidth;
        liveCameraCanvas.height = liveCameraCanvas.clientHeight;
        drawCoverImage(liveCamCtx, video, 0, 0, liveCameraCanvas.width, liveCameraCanvas.height, currentFacingMode === 'user');
        
        // رسم الاستيكر فوقها
        overlayCanvas.width = overlayCanvas.clientWidth;
        overlayCanvas.height = overlayCanvas.clientHeight;
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        drawSticker(overlayCtx, activeStickerIdx, overlayCanvas.width, overlayCanvas.height);
      }
      requestAnimationFrame(renderLiveView);
    }
    requestAnimationFrame(renderLiveView);

    // --- 5. التقاط الصور والدمج النهائي ---
    snapBtn.addEventListener('click', () => {
      flashEffect.style.opacity = '0.85';
      setTimeout(() => { flashEffect.style.opacity = '0'; }, 120);

      // حفظ الصورة النظيفة مع الاستيكر
      const shotCanvas = document.createElement('canvas');
      const w = 1080;
      const h = 1440; // نسبة طولية
      shotCanvas.width = w;
      shotCanvas.height = h;
      const sCtx = shotCanvas.getContext('2d');

      drawCoverImage(sCtx, video, 0, 0, w, h, currentFacingMode === 'user');
      drawSticker(sCtx, activeStickerIdx, w, h);

      sessionShots.push(shotCanvas);
      sessionCounter.textContent = `${sessionShots.length}/${targetShots}`;

      if (sessionShots.length === targetShots) {
        snapBtn.disabled = true;
        setTimeout(buildCollageAndFinalize, 200);
      }
    });

    function buildCollageAndFinalize() {
      const pool = FRAMES_CONFIG[targetShots];
      const selectedFrame = pool[Math.floor(Math.random() * pool.length)];

      const targetW = 1080;
      const targetH = 1920;
      canvas.width = targetW;
      canvas.height = targetH;
      ctx.clearRect(0, 0, targetW, targetH);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, targetW, targetH);

      // رسم الصور مع الميل والمط المضبوط (Cover) لمنع الحواف السوداء والتشوه
      selectedFrame.slots.forEach((slot, i) => {
        const shot = sessionShots[i];
        if (shot) {
          ctx.save();
          // الانتقال لمركز كارت البولارويد
          ctx.translate(slot.cx, slot.cy);
          // الدوران
          if (slot.rot) {
            ctx.rotate((slot.rot * Math.PI) / 180);
          }
          // الرسم مع القص التلقائي
          drawCoverImage(ctx, shot, -slot.w / 2, -slot.h / 2, slot.w, slot.h, false);
          ctx.restore();
        }
      });

      // رسم الفريم الشفاف فوق كل شيء
      const frameImg = loadedFrameImgs[selectedFrame.src];
      if (frameImg && frameImg.complete && frameImg.naturalWidth > 0) {
        ctx.drawImage(frameImg, 0, 0, targetW, targetH);
      }

      const finalDataUrl = canvas.toDataURL('image/jpeg', 0.92);
      savedCollages.unshift(finalDataUrl);
      updateGalleryThumb();
      openGalleryAt(0);

      // رفع لدرايف
      uploadStatus.style.opacity = '1';
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: finalDataUrl, filename: `Booth_${targetShots}Shots_${Date.now()}.jpg` })
      }).finally(() => {
        setTimeout(() => { uploadStatus.style.opacity = '0'; }, 3000);
      });

      resetSession();
    }

    // --- 6. المعرض ---
    function updateGalleryThumb() {
      if (savedCollages.length > 0) {
        thumbImg.src = savedCollages[0];
        thumbImg.classList.remove('hidden');
        emptyThumbIcon.classList.add('hidden');
        galleryBadge.textContent = savedCollages.length;
        galleryBadge.classList.remove('hidden');
      }
    }

    function openGalleryAt(index) {
      currentGalleryIndex = index;
      galleryMainImg.src = savedCollages[currentGalleryIndex];
      downloadPhotoBtn.href = savedCollages[currentGalleryIndex];
      galleryCounter.textContent = `${currentGalleryIndex + 1} / ${savedCollages.length}`;
      galleryModal.classList.remove('hidden');
      history.pushState({ gallery: true }, '');
    }

    galleryThumbBtn.addEventListener('click', () => {
      if (savedCollages.length > 0) openGalleryAt(0);
    });

    closeGalleryBtn.addEventListener('click', () => {
      galleryModal.classList.add('hidden');
    });

    window.addEventListener('popstate', () => {
      galleryModal.classList.add('hidden');
    });

    prevPhotoBtn.addEventListener('click', () => {
      if (currentGalleryIndex > 0) openGalleryAt(currentGalleryIndex - 1);
    });

    nextPhotoBtn.addEventListener('click', () => {
      if (currentGalleryIndex < savedCollages.length - 1) openGalleryAt(currentGalleryIndex + 1);
    });
  </script>
</body>
</html>
