<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class of 2026 - Graduation Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .selected-ring { outline: 3px solid #f59e0b; outline-offset: 2px; transform: scale(0.95); }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* إخفاء شريط التمرير الافتراضي عشان يكون التصميم احترافي للموبايل */
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-black text-white h-[100dvh] w-full overflow-hidden select-none font-sans relative">

  <!-- ==================== 1. شاشة تسجيل الدخول ==================== -->
  <div id="view-login" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-neutral-950 p-6 fade-in">
    <div class="w-full max-w-sm bg-neutral-900 border border-neutral-800 p-8 rounded-3xl shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-black text-amber-400 mb-2">Class of '26</h1>
        <p class="text-xs text-neutral-400">Graduation Photobooth</p>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="text-[11px] font-bold text-neutral-500 uppercase tracking-wider mb-1 block">Your Name</label>
          <input type="text" id="userName" placeholder="Enter your full name..." class="w-full bg-black border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors">
        </div>
        
        <div id="loginError" class="hidden text-xs text-red-400 text-center font-bold">Please enter your name!</div>
        
        <button id="loginBtn" class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-black font-black uppercase tracking-widest py-3.5 rounded-xl active:scale-95 transition-all shadow-[0_0_15px_rgba(245,158,11,0.2)]">
          Enter Booth
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. شاشة الإعدادات (اختيار عدد اللقطات فقط) ==================== -->
  <div id="view-setup" class="hidden absolute inset-0 z-40 flex flex-col bg-neutral-950 p-6 overflow-y-auto fade-in">
    <div class="w-full max-w-sm mx-auto pt-6 pb-24">
      <h2 class="text-2xl font-bold mb-1">Welcome, <span id="displayName" class="text-amber-400"></span>!</h2>
      <p class="text-xs text-neutral-400 mb-12">Select how many shots you want to take.</p>

      <h3 class="text-sm font-bold text-white mb-4">Select Number of Shots</h3>
      <div class="grid grid-cols-2 gap-4 mb-8">
        <button class="shot-btn bg-neutral-900 border border-neutral-700 py-6 rounded-2xl font-black text-xl transition-all selected-ring" data-shots="1">1 Shot</button>
        <button class="shot-btn bg-neutral-900 border border-neutral-700 py-6 rounded-2xl font-black text-xl transition-all" data-shots="2">2 Shots</button>
        <button class="shot-btn bg-neutral-900 border border-neutral-700 py-6 rounded-2xl font-black text-xl transition-all" data-shots="3">3 Shots</button>
        <button class="shot-btn bg-neutral-900 border border-neutral-700 py-6 rounded-2xl font-black text-xl transition-all" data-shots="4">4 Shots</button>
      </div>
    </div>

    <div class="fixed bottom-0 inset-x-0 p-5 bg-gradient-to-t from-black via-neutral-950 to-transparent flex justify-center">
      <button id="openCameraBtn" class="w-full max-w-sm bg-amber-500 hover:bg-amber-400 text-black font-black uppercase tracking-widest py-4 rounded-2xl active:scale-95 transition-all shadow-[0_0_20px_rgba(245,158,11,0.3)]">
        Open Camera
      </button>
    </div>
  </div>

  <!-- ==================== 3. شاشة الكاميرا المباشرة ==================== -->
  <div id="view-camera" class="hidden absolute inset-0 z-30 flex flex-col justify-between fade-in">
    <div class="absolute top-0 inset-x-0 z-40 flex items-center justify-between px-5 pt-5 pb-8 bg-gradient-to-b from-black/80 to-transparent">
      <button id="backToSetupBtn" class="text-xs font-bold text-neutral-300 bg-black/50 px-3 py-1.5 rounded-full border border-neutral-700 active:scale-95 backdrop-blur-sm">❮ Back</button>
      <span class="text-[10px] tracking-widest font-mono text-amber-300">CLASS OF 2026</span>
    </div>

    <!-- الكاميرا والاستيكر -->
    <div class="relative w-full h-full overflow-hidden bg-neutral-950 flex items-center justify-center">
      <video id="video" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
      <img id="liveSticker" src="" alt="" class="absolute pointer-events-none z-20 object-contain drop-shadow-2xl transition-all duration-300">
      <div id="flashEffect" class="absolute inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-150 z-30"></div>
    </div>

    <!-- شريط الاستيكرات المتحرك (Carousel) -->
    <div id="sticker-carousel" class="absolute bottom-[110px] inset-x-0 z-40 flex items-center gap-3 overflow-x-auto px-5 py-2 snap-x hide-scrollbar">
      <!-- الأكواد بتضيف الاستيكرات هنا أوتوماتيك -->
    </div>

    <div class="absolute bottom-0 inset-x-0 z-40 flex items-center justify-around px-5 pt-8 pb-6 bg-gradient-to-t from-black/95 via-black/80 to-transparent">
      <div class="w-14 h-14"></div> 
      
      <div class="relative flex items-center justify-center">
        <button id="snapBtn" class="w-20 h-20 rounded-full border-4 border-amber-400 flex items-center justify-center bg-black active:scale-95 transition-all shadow-[0_0_20px_rgba(251,191,36,0.3)]">
          <div id="snapInner" class="w-14 h-14 rounded-full bg-amber-400 active:bg-amber-300 flex items-center justify-center text-black font-bold text-xs"></div>
        </button>
        <span id="sessionCounter" class="absolute -top-3 bg-amber-400 text-black text-[11px] font-black px-2 py-0.5 rounded-full shadow">0/1</span>
      </div>

      <div class="w-14 h-14 flex items-center justify-center">
        <button id="flipBtn" class="w-12 h-12 rounded-full bg-neutral-800 border border-white/20 flex items-center justify-center active:scale-90 text-white backdrop-blur-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 4. شاشة النتيجة النهائية ==================== -->
  <div id="view-result" class="hidden absolute inset-0 z-50 flex flex-col justify-between bg-black p-4 fade-in">
    <div class="w-full flex items-center justify-between pt-2 pb-4">
      <button id="newSessionBtn" class="px-4 py-2 bg-neutral-900 rounded-full text-xs text-amber-300 font-bold border border-neutral-700 active:scale-95">
        + New Session
      </button>
      <span id="uploadStatus" class="text-emerald-400 text-xs font-bold opacity-0 transition-opacity">● Saved to Folder</span>
      <a id="downloadPhotoBtn" download="graduation-photobooth.jpg" class="px-5 py-2 bg-amber-500 text-black rounded-full text-xs font-bold active:scale-95">
        Download
      </a>
    </div>

    <div class="relative flex-1 flex items-center justify-center p-2">
      <img id="galleryMainImg" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl border border-neutral-800 bg-white p-2" alt="Final Shot">
    </div>
  </div>

  <!-- عناصر مخفية للعمليات -->
  <canvas id="compositeCanvas" class="hidden"></canvas>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJqgbbH2UBN-KzefwQspwHAU-iIx-W0gbcBGafuoFNNdzqT5lTlV3-C1lp8KCjuIhH/exec";

    let targetShots = 1;
    let activeStickerIdx = 0;
    let sessionShots = []; 
    let currentFacingMode = 'user';
    let isCameraActive = false;
    let registeredUserName = "Guest";

    const vLogin = document.getElementById('view-login');
    const vSetup = document.getElementById('view-setup');
    const vCamera = document.getElementById('view-camera');
    const vResult = document.getElementById('view-result');
    const video = document.getElementById('video');

    // --- 1. Login ---
    document.getElementById('loginBtn').addEventListener('click', () => {
      const nameInput = document.getElementById('userName').value.trim();
      if (nameInput !== '') {
        registeredUserName = nameInput;
        document.getElementById('displayName').textContent = registeredUserName;
        vLogin.classList.add('hidden');
        vSetup.classList.remove('hidden');
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });

    // --- 2. Setup (عدد الصور بس) ---
    const modeBtns = document.querySelectorAll('.shot-btn');
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('selected-ring', 'border-amber-500'));
        btn.classList.add('selected-ring', 'border-amber-500');
        targetShots = parseInt(btn.dataset.shots);
      });
    });

    document.getElementById('openCameraBtn').addEventListener('click', async () => {
      vSetup.classList.add('hidden');
      vCamera.classList.remove('hidden');
      sessionShots = [];
      document.getElementById('sessionCounter').textContent = `0/${targetShots}`;
      document.getElementById('snapBtn').disabled = false;
      document.getElementById('snapInner').textContent = '';
      applyLiveSticker();
      if (!isCameraActive) await startCamera();
    });

    document.getElementById('backToSetupBtn').addEventListener('click', () => {
      vCamera.classList.add('hidden');
      vSetup.classList.remove('hidden');
    });


    // =========================================================================
    //  إضافة الاستيكرات وتظبيطها (هنا المكان الوحيد اللي هتعدل فيه لو ضفت جديد)
    // =========================================================================
    const STICKERS_CONFIG = [
      { src: 'logo1.png', css: 'bottom: 5%; left: 50%; transform: translateX(-50%); width: 40%;' }, // منتصف تحت
      { src: 'logo2.png', css: 'right: 0; top: 50%; transform: translateY(-50%); width: 30%;' }, // يمين الشاشة
      { src: 'logo3.png', css: 'bottom: 0; left: 5%; width: 40%;' }, // تحت خالص شمال
      { src: 'logo4.png', css: 'top: 5%; left: 50%; transform: translateX(-50%); width: 60%;' }, // منتصف فوق
      { src: 'logo5.png', css: 'bottom: 0; left: 0; width: 100%; object-fit: contain;' } // عرض الشاشة كامل من تحت
      
      // لو عايز تضيف استيكر سادس، امسح العلامتين (//) من السطر اللي تحت وحط بياناته:
      // , { src: 'logo6.png', css: 'top: 5%; right: 5%; width: 30%;' }
    ];

    const loadedStickers = [];
    const carousel = document.getElementById('sticker-carousel');

    // برمجة شريط الاستيكرات أوتوماتيكياً
    STICKERS_CONFIG.forEach((cfg, idx) => {
      const img = new Image(); 
      img.src = cfg.src; 
      loadedStickers.push(img);

      // إنشاء الزرار بتاع الشريط
      const btn = document.createElement('div');
      btn.className = `flex-shrink-0 w-16 h-16 bg-white/90 backdrop-blur rounded-xl p-1.5 flex items-center justify-center transition-all cursor-pointer snap-center border-2 shadow-lg ${idx === 0 ? 'border-amber-500 scale-110' : 'border-transparent'}`;
      btn.dataset.idx = idx;
      
      const thumbImg = document.createElement('img');
      thumbImg.src = cfg.src;
      thumbImg.className = "max-w-full max-h-full object-contain drop-shadow-sm";
      btn.appendChild(thumbImg);

      // لما تدوس على أي استيكر في الشريط
      btn.addEventListener('click', () => {
        // شيل التحديد من كله
        Array.from(carousel.children).forEach(c => {
          c.classList.remove('border-amber-500', 'scale-110');
          c.classList.add('border-transparent');
        });
        // ضيف التحديد للي دوست عليه
        btn.classList.remove('border-transparent');
        btn.classList.add('border-amber-500', 'scale-110');
        
        // غير الاستيكر على الشاشة
        activeStickerIdx = idx;
        applyLiveSticker();
      });

      carousel.appendChild(btn);
    });

    function applyLiveSticker() {
      const cfg = STICKERS_CONFIG[activeStickerIdx];
      const ls = document.getElementById('liveSticker');
      ls.src = cfg.src;
      ls.style.cssText = cfg.css;
    }

    // --- 3. تشغيل الكاميرا ---
    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => { video.play(); };
        if (currentFacingMode === 'user') {
          video.classList.add('-scale-x-100');
        } else {
          video.classList.remove('-scale-x-100');
        }
      } catch (err) {
        alert('Camera permission is required. Please check your browser settings.');
      }
    }

    document.getElementById('flipBtn').addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      await startCamera();
    });

    function drawCoverImage(tCtx, source, dx, dy, dw, dh, isMirrored) {
      const sw = source.videoWidth || source.width;
      const sh = source.videoHeight || source.height;
      if (!sw || !sh) return;
      const sRatio = sw / sh; const dRatio = dw / dh;
      let sx, sy, sCropW, sCropH;
      if (sRatio > dRatio) { sCropH = sh; sCropW = sh * dRatio; sx = (sw - sCropW) / 2; sy = 0; } 
      else { sCropW = sw; sCropH = sw / dRatio; sx = 0; sy = (sh - sCropH) / 2; }
      tCtx.save();
      if (isMirrored) { tCtx.translate(dx + dw, dy); tCtx.scale(-1, 1); tCtx.drawImage(source, sx, sy, sCropW, sCropH, 0, 0, dw, dh); } 
      else { tCtx.drawImage(source, sx, sy, sCropW, sCropH, dx, dy, dw, dh); }
      tCtx.restore();
    }

    // --- 4. الالتقاط المباشر ---
    document.getElementById('snapBtn').addEventListener('click', () => {
      document.getElementById('flashEffect').style.opacity = '0.85';
      setTimeout(() => { document.getElementById('flashEffect').style.opacity = '0'; }, 120);

      document.getElementById('snapBtn').disabled = true;
      document.getElementById('snapInner').textContent = 'Wait';

      const cvs = document.createElement('canvas');
      const w = 1080; const h = 1440; // نسبة 3:4
      cvs.width = w; cvs.height = h;
      const ctx = cvs.getContext('2d');

      // رسم الكاميرا
      drawCoverImage(ctx, video, 0, 0, w, h, currentFacingMode === 'user');

      // دمج الاستيكر مباشرة فوق الصورة
      const sticker = loadedStickers[activeStickerIdx];
      if (sticker && sticker.complete && sticker.naturalWidth > 0) {
        const aspect = sticker.naturalWidth / sticker.naturalHeight;
        let dw, dh, dx, dy;
        switch(activeStickerIdx) {
          case 0: dw = w * 0.40; dh = dw / aspect; dx = (w - dw) / 2; dy = h - dh - (h * 0.05); break; 
          case 1: dw = w * 0.30; dh = dw / aspect; dx = w - dw; dy = (h - dh) / 2; break; 
          case 2: dw = w * 0.40; dh = dw / aspect; dx = w * 0.05; dy = h - dh; break; 
          case 3: dw = w * 0.60; dh = dw / aspect; dx = (w - dw) / 2; dy = h * 0.05; break; 
          case 4: dw = w; dh = dw / aspect; dx = 0; dy = h - dh; break; 
          // لو ضفت استيكر سادس، زود مقاسه هنا:
          // case 5: dw = w * 0.30; dh = dw / aspect; dx = w - dw - (w * 0.05); dy = h * 0.05; break;
        }
        ctx.drawImage(sticker, dx, dy, dw, dh);
      }

      sessionShots.push(cvs);
      document.getElementById('sessionCounter').textContent = `${sessionShots.length}/${targetShots}`;

      if (sessionShots.length === targetShots) {
        setTimeout(buildPhotoboothStrip, 300);
      } else {
        document.getElementById('snapBtn').disabled = false;
        document.getElementById('snapInner').textContent = '';
      }
    });

    // --- 5. تجميع الصور في شريط كلاسيكي بدون فريمات ---
    function buildPhotoboothStrip() {
      const canvas = document.getElementById('compositeCanvas');
      const ctx = canvas.getContext('2d');
      
      const photoW = 1080;
      const photoH = 1440;
      const padding = 40; 

      let cols, rows;
      if (targetShots === 1) { cols = 1; rows = 1; }
      else if (targetShots === 2) { cols = 1; rows = 2; }
      else if (targetShots === 3) { cols = 1; rows = 3; }
      else if (targetShots === 4) { cols = 2; rows = 2; }

      canvas.width = (photoW * cols) + (padding * (cols + 1));
      canvas.height = (photoH * rows) + (padding * (rows + 1));

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      sessionShots.forEach((shotCanvas, i) => {
        let col = i % cols;
        let row = Math.floor(i / cols);
        let dx = padding + (col * (photoW + padding));
        let dy = padding + (row * (photoH + padding));
        ctx.drawImage(shotCanvas, dx, dy, photoW, photoH);
      });

      const finalDataUrl = canvas.toDataURL('image/jpeg', 0.92);
      
      document.getElementById('galleryMainImg').src = finalDataUrl;
      document.getElementById('downloadPhotoBtn').href = finalDataUrl;
      vCamera.classList.add('hidden');
      vResult.classList.remove('hidden');

      const upStatus = document.getElementById('uploadStatus');
      upStatus.style.opacity = '1';
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          image: finalDataUrl, 
          filename: `Photobooth_${targetShots}Shots_${Date.now()}.jpg`,
          folderName: registeredUserName
        })
      }).finally(() => { setTimeout(() => { upStatus.style.opacity = '0'; }, 3000); });
    }

    document.getElementById('newSessionBtn').addEventListener('click', () => {
      vResult.classList.add('hidden');
      vSetup.classList.remove('hidden');
    });
  </script>
</body>
</html>
