<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class of 2026 - Graduation Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-[100dvh] w-full overflow-hidden select-none font-sans relative">

  <!-- Top Status Bar -->
  <div class="absolute top-0 inset-x-0 z-30 flex items-center justify-between px-5 pt-4 pb-8 bg-gradient-to-b from-black/80 to-transparent text-xs tracking-widest font-mono">
    <span class="text-amber-300/90 font-bold">CLASS OF 2026</span>
    <span id="uploadStatus" class="text-emerald-400 opacity-0 transition-opacity duration-300 flex items-center gap-1.5">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      Saved to Drive
    </span>
  </div>

  <!-- Camera Permission Error -->
  <div id="errorBox" class="hidden absolute top-16 inset-x-4 z-40 bg-red-900/90 border border-red-500 p-3 rounded-2xl text-center text-xs text-red-200"></div>

  <!-- Full-Screen Camera & Frame Viewport -->
  <div class="relative w-full h-full overflow-hidden bg-neutral-950 flex items-center justify-center">
    <video id="video" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
    <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
    <div id="flashEffect" class="absolute inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-150 z-20"></div>
  </div>

  <!-- Floating Switch Frame Button (Top Right) -->
  <button id="switchFrameBtn" class="absolute top-14 right-4 z-30 px-3 py-1.5 rounded-full bg-black/60 backdrop-blur-md border border-white/20 text-[11px] font-bold text-amber-300 flex items-center gap-1.5 active:scale-95 transition-all">
    <span>✨ Change Frame</span>
  </button>

  <!-- Bottom Camera Controls -->
  <div class="absolute bottom-0 inset-x-0 z-30 flex items-center justify-around px-6 pt-10 pb-8 bg-gradient-to-t from-black/90 via-black/40 to-transparent">
    
    <!-- Gallery Thumbnail -->
    <div class="relative w-14 h-14 flex items-center justify-center">
      <button id="galleryThumbBtn" class="w-13 h-13 rounded-2xl border-2 border-white/40 overflow-hidden bg-neutral-900 focus:outline-none active:scale-90 transition-transform">
        <img id="thumbImg" src="" class="hidden w-full h-full object-cover" alt="Gallery">
        <div id="emptyThumbIcon" class="text-xl text-neutral-500 flex items-center justify-center h-full">🖼️</div>
      </button>
      <span id="photoBadge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-black px-1.5 py-0.5 rounded-full shadow">0</span>
    </div>

    <!-- Shutter Capture Button -->
    <button id="snapBtn" class="w-20 h-20 rounded-full border-4 border-amber-400 flex items-center justify-center bg-black active:scale-95 transition-all shadow-lg shadow-amber-500/20">
      <div class="w-14 h-14 rounded-full bg-amber-400 active:bg-amber-300"></div>
    </button>

    <!-- Flip Camera Button -->
    <button id="flipBtn" class="w-14 h-14 rounded-2xl bg-neutral-900/80 border border-white/20 flex items-center justify-center active:scale-90 transition-transform text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </button>
  </div>

  <!-- Full-Screen Gallery Viewer -->
  <div id="galleryModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col justify-between p-4">
    <div class="w-full flex items-center justify-between pt-2 pb-4 border-b border-neutral-800">
      <button id="closeGalleryBtn" class="px-4 py-1.5 bg-neutral-900 rounded-full text-xs text-amber-300 font-bold border border-neutral-700 active:scale-95">
        Back to Camera
      </button>
      <span id="galleryCounter" class="text-xs text-neutral-400 font-mono">1 / 1</span>
      <a id="downloadPhotoBtn" download="graduation-2026.jpg" class="px-5 py-1.5 bg-amber-500 hover:bg-amber-400 text-black rounded-full text-xs font-bold active:scale-95 transition-all">
        Download
      </a>
    </div>

    <div class="relative flex-1 flex items-center justify-center p-2">
      <img id="galleryMainImg" class="max-w-full max-h-[72vh] object-contain rounded-2xl shadow-2xl border border-neutral-800" alt="Captured Photo">
    </div>

    <div class="w-full flex items-center justify-between px-6 pb-4">
      <button id="prevPhotoBtn" class="w-12 h-12 rounded-full bg-neutral-900 border border-neutral-700 text-lg flex items-center justify-center active:scale-90 transition-transform">
        ❮
      </button>
      <span class="text-[11px] text-neutral-500">Browse Photos</span>
      <button id="nextPhotoBtn" class="w-12 h-12 rounded-full bg-neutral-900 border border-neutral-700 text-lg flex items-center justify-center active:scale-90 transition-transform">
        ❯
      </button>
    </div>
  </div>

  <canvas id="compositeCanvas" class="hidden"></canvas>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJqgbbH2UBN-KzefwQspwHAU-iIx-W0gbcBGafuoFNNdzqT5lTlV3-C1lp8KCjuIhH/exec";

    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snapBtn');
    const flipBtn = document.getElementById('flipBtn');
    const switchFrameBtn = document.getElementById('switchFrameBtn');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const canvas = document.getElementById('compositeCanvas');
    const ctx = canvas.getContext('2d');
    const errorBox = document.getElementById('errorBox');
    const flashEffect = document.getElementById('flashEffect');
    const uploadStatus = document.getElementById('uploadStatus');

    const galleryThumbBtn = document.getElementById('galleryThumbBtn');
    const thumbImg = document.getElementById('thumbImg');
    const emptyThumbIcon = document.getElementById('emptyThumbIcon');
    const photoBadge = document.getElementById('photoBadge');
    const galleryModal = document.getElementById('galleryModal');
    const closeGalleryBtn = document.getElementById('closeGalleryBtn');
    const galleryMainImg = document.getElementById('galleryMainImg');
    const galleryCounter = document.getElementById('galleryCounter');
    const downloadPhotoBtn = document.getElementById('downloadPhotoBtn');
    const prevPhotoBtn = document.getElementById('prevPhotoBtn');
    const nextPhotoBtn = document.getElementById('nextPhotoBtn');

    let currentFacingMode = 'user';
    let userPhotos = [];
    let currentPhotoIndex = 0;

    // تحميل الفريمين واختيار عشوائي عند فتح الصفحة
    const frames = [new Image(), new Image()];
    frames[0].src = 'frame1.png';
    frames[1].src = 'frame2.png';
    
    // اختيار عشوائي (0 أو 1)
    let activeFrameIndex = Math.random() < 0.5 ? 0 : 1;

    // زرار تبديل الفريم يدوياً
    switchFrameBtn.addEventListener('click', () => {
      activeFrameIndex = activeFrameIndex === 0 ? 1 : 0;
      renderLiveFrame();
    });

    frames[0].onload = frames[1].onload = () => renderLiveFrame();
    window.addEventListener('resize', renderLiveFrame);

    // دالة التمدد الذكي 9-Slice (تثبيت الهيدر والفوتر وتمديد الأعمدة فقط)
    function drawAdaptiveFrame(targetCtx, img, targetW, targetH) {
      if (!img.complete || img.naturalWidth === 0) return;

      const sw = img.naturalWidth;
      const sh = img.naturalHeight;

      // نسب القطع (20% هيدر علوي، 18% فوتر سفلي)
      const topSlice = sh * 0.20;
      const btmSlice = sh * 0.18;
      const midSlice = sh - topSlice - btmSlice;

      // الحفاظ على نسبة العرض للارتفاع للهيدر والفوتر
      const scale = targetW / sw;
      const targetTopH = topSlice * scale;
      const targetBtmH = btmSlice * scale;
      const targetMidH = targetH - targetTopH - targetBtmH;

      // 1. رسم الهيدر العلوي بأبعاده الطبيعية الثابتة
      targetCtx.drawImage(img, 0, 0, sw, topSlice, 0, 0, targetW, targetTopH);

      // 2. تمديد الأعمدة الجانبية في المنتصف فقط حسب طول الشاشة
      targetCtx.drawImage(img, 0, topSlice, sw, midSlice, 0, targetTopH, targetW, targetMidH);

      // 3. رسم الفوتر السفلي بأبعاده الطبيعية الثابتة
      targetCtx.drawImage(img, 0, sh - btmSlice, sw, btmSlice, 0, targetH - targetBtmH, targetW, targetBtmH);
    }

    function renderLiveFrame() {
      overlayCanvas.width = overlayCanvas.clientWidth;
      overlayCanvas.height = overlayCanvas.clientHeight;
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      drawAdaptiveFrame(overlayCtx, frames[activeFrameIndex], overlayCanvas.width, overlayCanvas.height);
    }

    // 2. تشغيل الكاميرا
    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        if (currentFacingMode === 'user') {
          video.classList.add('-scale-x-100');
        } else {
          video.classList.remove('-scale-x-100');
        }
      } catch (err) {
        errorBox.classList.remove('hidden');
        errorBox.textContent = 'Please allow camera permissions in your browser settings.';
      }
    }
    startCamera();

    flipBtn.addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      await startCamera();
    });

    // 3. التقاط الصورة ودمجها بالتمدد المناسب لشاشة الموبايل
    snapBtn.addEventListener('click', async () => {
      flashEffect.style.opacity = '0.85';
      setTimeout(() => { flashEffect.style.opacity = '0'; }, 120);

      const targetW = 1080;
      // حساب الارتفاع المستهدف بناءً على أبعاد شاشة جهاز المستخدم بالضبط
      const screenRatio = window.innerHeight / window.innerWidth;
      const targetH = Math.round(targetW * screenRatio);

      canvas.width = targetW;
      canvas.height = targetH;

      const vw = video.videoWidth || 1080;
      const vh = video.videoHeight || 1920;
      const targetRatio = targetW / targetH;
      const videoRatio = vw / vh;

      let sW, sH, sX, sY;
      if (videoRatio > targetRatio) {
        sH = vh;
        sW = vh * targetRatio;
        sX = (vw - sW) / 2;
        sY = 0;
      } else {
        sW = vw;
        sH = vw / targetRatio;
        sX = 0;
        sY = (vh - sH) / 2;
      }

      // رسم فيديو الكاميرا
      ctx.save();
      if (currentFacingMode === 'user') {
        ctx.translate(targetW, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, sX, sY, sW, sH, 0, 0, targetW, targetH);
      ctx.restore();

      // تطبيق التمدد الذكي للفريم فوق الصورة
      drawAdaptiveFrame(ctx, frames[activeFrameIndex], targetW, targetH);

      const base64Image = canvas.toDataURL('image/jpeg', 0.9);

      userPhotos.unshift(base64Image);
      updateThumbnail();

      uploadStatus.style.opacity = '1';
      setTimeout(() => { uploadStatus.style.opacity = '0'; }, 2500);

      // رفع تلقائي لجوجل درايف
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64Image, filename: `Grad_${Date.now()}.jpg` })
      }).catch(err => console.error(err));
    });

    function updateThumbnail() {
      if (userPhotos.length > 0) {
        thumbImg.src = userPhotos[0];
        thumbImg.classList.remove('hidden');
        emptyThumbIcon.classList.add('hidden');
        photoBadge.textContent = userPhotos.length;
        photoBadge.classList.remove('hidden');
      }
    }

    // 4. معرض الصور الشخصي
    galleryThumbBtn.addEventListener('click', () => {
      if (userPhotos.length === 0) return;
      currentPhotoIndex = 0;
      showGalleryPhoto(currentPhotoIndex);
      galleryModal.classList.remove('hidden');
      history.pushState({ gallery: true }, '');
    });

    function showGalleryPhoto(index) {
      if (index < 0 || index >= userPhotos.length) return;
      currentPhotoIndex = index;
      galleryMainImg.src = userPhotos[currentPhotoIndex];
      downloadPhotoBtn.href = userPhotos[currentPhotoIndex];
      galleryCounter.textContent = `${currentPhotoIndex + 1} / ${userPhotos.length}`;
    }

    prevPhotoBtn.addEventListener('click', () => {
      if (currentPhotoIndex > 0) showGalleryPhoto(currentPhotoIndex - 1);
    });

    nextPhotoBtn.addEventListener('click', () => {
      if (currentPhotoIndex < userPhotos.length - 1) showGalleryPhoto(currentPhotoIndex + 1);
    });

    closeGalleryBtn.addEventListener('click', () => {
      if (history.state && history.state.gallery) {
        history.back();
      } else {
        galleryModal.classList.add('hidden');
      }
    });

    window.addEventListener('popstate', () => {
      galleryModal.classList.add('hidden');
    });
  </script>
</body>
</html>
