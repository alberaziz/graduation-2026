<!DOCTYPE html>
<html lang="en" class="h-full bg-[#07070a] text-[#f3f4f6]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Graduate 2026 - Church of the Virgin Mary & St. Mina Photobooth</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              300: '#fde68a',
              400: '#f6d365',
              500: '#d4af37',
              600: '#b89228',
              700: '#8c6d1a',
            },
            surface: {
              950: '#07070a',
              900: '#0b0c10',
              850: '#111319',
              800: '#171922',
              750: '#1f222e',
              700: '#262a38',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input {
      user-select: text;
    }

    /* Fast, silky view transitions using GPU transforms */
    .view-fade {
      transition: opacity 0.22s ease, transform 0.22s ease;
      will-change: opacity, transform;
    }
    .slide-panel {
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .shutter-flash {
      transition: opacity 0.08s ease-out;
      will-change: opacity;
    }
    .btn-bounce:active {
      transform: scale(0.92);
    }

    /* Natural selfie mirroring */
    .mirrored {
      transform: scaleX(-1);
    }

    /* ======================================================== */
    /* MASTER LIGHTBOX (Zoom & Fade In Animation)               */
    /* ======================================================== */
    #view-lightbox {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s ease;
      will-change: opacity, visibility;
    }
    #view-lightbox.lightbox-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #lightbox-photo-container {
      transform: scale(0.80);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }
    #view-lightbox.lightbox-active #lightbox-photo-container {
      transform: scale(1);
      opacity: 1;
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden bg-[#07070a] font-sans antialiased text-neutral-200">

  <!-- Mobile-First Container (Full screen on phones, sleek frame on desktop) -->
  <div class="relative mx-auto flex h-full w-full max-w-md flex-col overflow-hidden bg-surface-900 shadow-2xl border-x border-neutral-900">

    <!-- Top Status / Branding Header -->
    <header class="relative z-30 flex h-14 shrink-0 items-center justify-between border-b border-gold-500/20 bg-surface-850 px-4">
      <div class="flex items-center space-x-2.5">
        <div class="flex h-7 w-7 items-center justify-center rounded-full bg-gradient-to-tr from-gold-600 to-gold-400 text-black shadow-sm">
          <!-- Graduation Cap Icon -->
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
          </svg>
        </div>
        <span class="text-sm font-bold tracking-wider text-gold-400 uppercase">GRADUATE 2026</span>
      </div>

      <!-- User Active Tag & Exit Button -->
      <div class="flex items-center space-x-2">
        <div id="header-user-tag" class="hidden items-center space-x-1.5 rounded-full border border-gold-500/25 bg-surface-800 px-3 py-1 text-xs text-neutral-300">
          <span class="h-1.5 w-1.5 rounded-full bg-gold-400"></span>
          <span id="header-user-name" class="max-w-[100px] truncate font-medium">Guest</span>
        </div>
        <button id="logout-btn" title="Switch Guest" class="hidden text-xs text-neutral-400 hover:text-gold-400 transition-colors px-2 py-1 rounded border border-neutral-800 active:scale-95">
          Exit
        </button>
      </div>
    </header>

    <!-- Camera Shutter White Flash (Pure CSS opacity) -->
    <div id="shutter-flash-overlay" class="pointer-events-none absolute inset-0 z-50 bg-white opacity-0 shutter-flash"></div>

    <!-- MAIN APP SCREENS -->
    <main class="relative flex-1 overflow-hidden">

      <!-- ========================================== -->
      <!-- VIEW 1: LOGIN VIEW                         -->
      <!-- ========================================== -->
      <section id="login-view" class="view-fade absolute inset-0 flex flex-col justify-center p-6 opacity-100 z-10">
        <div class="flex flex-col items-center text-center">
          <!-- Graduation Monogram Emblem -->
          <div class="relative mb-6 flex h-20 w-20 items-center justify-center rounded-2xl border border-gold-500/30 bg-surface-850 shadow-lg">
            <div class="absolute inset-1 rounded-xl border border-gold-500/10"></div>
            <svg class="h-10 w-10 text-gold-400" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
            </svg>
          </div>

          <!-- Main Heading -->
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white leading-snug">
            Church Of The Virgin Mary and St. Mina
          </h1>

          <!-- Form: Cleaned up with no placeholders, subtitles, or helper text -->
          <form id="login-form" class="mt-8 w-full space-y-5">
            <div class="text-left">
              <label for="user-name-input" class="block text-xs font-semibold uppercase tracking-wider text-gold-400/90 mb-2 ml-1">
                Your Full Name
              </label>
              <input
                type="text"
                id="user-name-input"
                required
                placeholder=""
                autocomplete="name"
                class="w-full rounded-xl border border-neutral-800 bg-surface-850 px-4 py-3.5 text-sm text-white transition-colors focus:border-gold-500 focus:outline-none"
              />
            </div>

            <button
              type="submit"
              class="btn-bounce w-full rounded-xl bg-gradient-to-r from-gold-600 via-gold-500 to-gold-400 py-3.5 text-sm font-semibold text-black tracking-wide shadow-md transition-transform duration-150 active:scale-95 hover:brightness-105"
            >
              Enter Photobooth
            </button>
          </form>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- VIEW 2: CONTINUOUS CAMERA VIEW             -->
      <!-- ========================================== -->
      <section id="camera-view" class="view-fade absolute inset-0 flex flex-col justify-between opacity-0 pointer-events-none z-0">
        <!-- Live Video Viewfinder with Contemporary Graduation Frame Overlay -->
        <div class="relative flex-1 overflow-hidden bg-black flex items-center justify-center">
          <video
            id="camera-stream"
            autoplay
            playsinline
            muted
            class="h-full w-full object-cover mirrored"
          ></video>

          <!-- Transparent Graduation 2026 Party Frame (Overlay positioned on top of live feed) -->
          <div class="pointer-events-none absolute inset-0 z-10 flex items-center justify-center">
            <img
              id="camera-frame-overlay"
              alt="Graduation 2026 Frame Overlay"
              class="h-full w-full object-contain pointer-events-none select-none"
            />
          </div>

          <!-- Camera Loading / Status Message -->
          <div id="camera-status-msg" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center p-6 text-center text-sm text-neutral-400 hidden z-20">
            <div class="h-8 w-8 rounded-full border-2 border-gold-500 border-t-transparent animate-spin mb-2"></div>
            <p id="camera-status-text">Accessing camera...</p>
          </div>
        </div>

        <!-- Camera Controls Toolbar -->
        <div class="relative z-20 flex h-28 shrink-0 items-center justify-between border-t border-neutral-800 bg-surface-850 px-8">
          
          <!-- CIRCULAR ALBUM / GALLERY BUTTON -->
          <button
            id="gallery-open-btn"
            title="Open Session Album"
            class="btn-bounce relative flex h-14 w-14 items-center justify-center rounded-full border-2 border-gold-500 bg-surface-800 p-0.5 shadow-lg transition-transform duration-150 active:scale-90"
          >
            <!-- Thumbnail Image -->
            <img
              id="gallery-thumb-preview"
              alt="Latest Photo Thumbnail"
              class="hidden h-full w-full rounded-full object-cover"
            />

            <!-- Placeholder Icon -->
            <div id="gallery-thumb-placeholder" class="flex flex-col items-center justify-center text-gold-400">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
              </svg>
            </div>

            <!-- Photos Count Badge -->
            <span
              id="gallery-count-badge"
              class="absolute -top-1 -right-1 hidden h-5 min-w-[20px] items-center justify-center rounded-full bg-gold-400 px-1 text-[11px] font-bold text-black shadow-md"
            >
              0
            </span>
          </button>

          <!-- MAIN SHUTTER BUTTON (Continuous Back-to-Back Capture) -->
          <div class="relative flex items-center justify-center">
            <button
              id="shutter-btn"
              title="Take Photo"
              class="btn-bounce group relative flex h-20 w-20 items-center justify-center rounded-full border-2 border-gold-500 p-1.5 transition-transform duration-100 active:scale-90"
            >
              <div class="h-full w-full rounded-full bg-gradient-to-tr from-gold-500 to-gold-300 shadow-md group-hover:brightness-110"></div>
            </button>
          </div>

          <!-- FLIP CAMERA BUTTON (Front / Rear) -->
          <button
            id="flip-cam-btn"
            title="Switch Camera"
            class="btn-bounce flex h-14 w-14 items-center justify-center rounded-full border border-neutral-700 bg-surface-800 text-neutral-300 transition-transform duration-150 active:scale-90 shadow-md"
          >
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- VIEW 3: IN-APP GALLERY (SLIDE-UP PANEL)    -->
      <!-- ========================================== -->
      <section
        id="gallery-view"
        class="slide-panel absolute inset-0 z-40 flex flex-col bg-surface-900 translate-y-full"
      >
        <!-- Gallery Top Navigation Bar -->
        <div class="flex h-14 shrink-0 items-center justify-between border-b border-neutral-800 bg-surface-850 px-4">
          <button
            id="gallery-back-btn"
            class="btn-bounce flex items-center space-x-1.5 text-xs font-semibold text-gold-400 py-1.5 px-3 rounded-lg border border-gold-500/25 bg-surface-800 transition-transform"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            <span>Back to Camera</span>
          </button>

          <div class="flex items-center space-x-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-neutral-300">Session Album</span>
            <span id="gallery-header-count" class="rounded-full bg-gold-500/20 px-2 py-0.5 text-[11px] font-bold text-gold-400">0</span>
          </div>
        </div>

        <!-- Scrollable Photo Grid -->
        <div id="gallery-scroll-container" class="flex-1 overflow-y-auto p-4">
          
          <!-- Empty State (when 0 photos) -->
          <div id="gallery-empty-state" class="flex h-full flex-col items-center justify-center text-center p-6">
            <div class="flex h-16 w-16 items-center justify-center rounded-2xl border border-gold-500/30 bg-surface-850 text-gold-400 mb-3 shadow-md">
              <svg class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/>
              </svg>
            </div>
            <h3 class="text-sm font-semibold text-white">No Photos Captured Yet</h3>
            <p class="mt-1 text-xs text-neutral-500">Tap the shutter button on the camera screen to take your first photo!</p>
          </div>

          <!-- Active Photo Grid -->
          <div id="gallery-grid" class="hidden grid grid-cols-2 gap-3.5 pb-8"></div>
        </div>
      </section>

    </main>

    <!-- Off-screen Canvas for Photo Compositing -->
    <canvas id="capture-canvas" class="hidden"></canvas>

  </div>

  <!-- ========================================================================= -->
  <!-- VIEW 4: MASTER FULLSCREEN LIGHTBOX OVERLAY (COMPLETE BACKGROUND BLOCK)    -->
  <!-- Placed directly in body at z-[100] with backdrop-blur-xl for 100% isolation -->
  <!-- ========================================================================= -->
  <div
    id="view-lightbox"
    class="fixed inset-0 z-[100] flex flex-col justify-between p-4 sm:p-6 bg-black/85 backdrop-blur-xl"
  >
    <!-- 1. Floating Circular Close (X) Button (Top Right) -->
    <div class="w-full flex justify-end shrink-0 pt-1 pr-1">
      <button
        id="lightbox-close-btn"
        title="Close Preview"
        class="btn-bounce flex h-11 w-11 items-center justify-center rounded-full bg-white/10 hover:bg-white/20 active:scale-90 border border-white/20 text-white shadow-xl transition-all"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- 2. Perfectly Centered, Proportional Photograph (Zoom Animation) -->
    <div id="lightbox-photo-container" class="relative flex flex-1 items-center justify-center my-auto w-full overflow-hidden">
      <img
        id="lightbox-photo-img"
        alt="Graduation Photograph"
        class="max-w-[90%] max-h-[75vh] w-auto h-auto object-contain mx-auto rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.7)] border border-gold-500/30"
      />
    </div>

    <!-- 3. Prominent Amber/Gold Download Button (Bottom Center) -->
    <div class="w-full flex justify-center shrink-0 pb-3 sm:pb-5">
      <button
        id="lightbox-download-btn"
        class="btn-bounce flex items-center justify-center space-x-2.5 rounded-2xl bg-gradient-to-r from-gold-600 via-gold-500 to-gold-400 py-3.5 px-8 text-xs sm:text-sm font-bold uppercase tracking-wider text-black shadow-[0_12px_30px_rgba(212,175,55,0.35)] transition-transform duration-100 hover:brightness-105 active:scale-95"
      >
        <svg class="h-4 w-4 sm:h-5 sm:w-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
        </svg>
        <span>Download Photo</span>
      </button>
    </div>
  </div>

  <script>
    (() => {

      const GRADUATION_FRAME_DATA_URL = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(GRADUATION_FRAME_SVG.trim());

      const frameImage = new Image();
      frameImage.crossOrigin = "anonymous";
      frameImage.src = GRADUATION_FRAME_DATA_URL;

      const cameraFrameOverlay = document.getElementById("camera-frame-overlay");
      cameraFrameOverlay.src = GRADUATION_FRAME_DATA_URL;

      // =========================================================================
      // 3. APPLICATION STATE & GLOBAL SESSION PHOTOS ARRAY
      // =========================================================================
      const sessionPhotos = []; // Stores Base64 data URLs for in-app album
      let currentLightboxIndex = 0;

      const state = {
        userName: "",
        stream: null,
        facingMode: "user"
      };

      // DOM Elements
      const loginView = document.getElementById("login-view");
      const cameraView = document.getElementById("camera-view");
      const galleryView = document.getElementById("gallery-view");
      const lightboxView = document.getElementById("view-lightbox");

      const loginForm = document.getElementById("login-form");
      const userNameInput = document.getElementById("user-name-input");
      const headerUserTag = document.getElementById("header-user-tag");
      const headerUserName = document.getElementById("header-user-name");
      const logoutBtn = document.getElementById("logout-btn");

      const video = document.getElementById("camera-stream");
      const shutterBtn = document.getElementById("shutter-btn");
      const flipCamBtn = document.getElementById("flip-cam-btn");
      const shutterFlash = document.getElementById("shutter-flash-overlay");
      const canvas = document.getElementById("capture-canvas");
      const cameraStatusMsg = document.getElementById("camera-status-msg");
      const cameraStatusText = document.getElementById("camera-status-text");

      // Gallery Elements
      const galleryOpenBtn = document.getElementById("gallery-open-btn");
      const galleryBackBtn = document.getElementById("gallery-back-btn");
      const galleryThumbPreview = document.getElementById("gallery-thumb-preview");
      const galleryThumbPlaceholder = document.getElementById("gallery-thumb-placeholder");
      const galleryCountBadge = document.getElementById("gallery-count-badge");
      const galleryHeaderCount = document.getElementById("gallery-header-count");
      const galleryEmptyState = document.getElementById("gallery-empty-state");
      const galleryGrid = document.getElementById("gallery-grid");

      // Lightbox Elements
      const lightboxPhotoImg = document.getElementById("lightbox-photo-img");
      const lightboxCloseBtn = document.getElementById("lightbox-close-btn");
      const lightboxDownloadBtn = document.getElementById("lightbox-download-btn");

      // =========================================================================
      // 4. SCREEN NAVIGATION
      // =========================================================================
      function showView(viewId) {
        [loginView, cameraView].forEach(v => {
          if (v.id === viewId) {
            v.classList.remove("opacity-0", "pointer-events-none", "z-0");
            v.classList.add("opacity-100", "z-10");
          } else {
            v.classList.remove("opacity-100", "z-10");
            v.classList.add("opacity-0", "pointer-events-none", "z-0");
          }
        });
      }

      function openGalleryPanel() {
        renderGalleryGrid();
        galleryView.classList.remove("translate-y-full");
        galleryView.classList.add("translate-y-0");
      }

      function closeGalleryPanel() {
        galleryView.classList.remove("translate-y-0");
        galleryView.classList.add("translate-y-full");
      }

      // =========================================================================
      // 5. CAMERA STREAM MANAGEMENT
      // =========================================================================
      async function startCamera() {
        stopCamera();
        cameraStatusMsg.classList.remove("hidden");
        cameraStatusText.textContent = "Opening camera...";

        const constraints = {
          audio: false,
          video: {
            facingMode: state.facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        try {
          state.stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = state.stream;

          if (state.facingMode === "user") {
            video.classList.add("mirrored");
          } else {
            video.classList.remove("mirrored");
          }

          video.onloadedmetadata = () => {
            cameraStatusMsg.classList.add("hidden");
            video.play();
          };
        } catch (err) {
          console.error("Camera access error:", err);
          cameraStatusMsg.classList.remove("hidden");
          cameraStatusText.textContent = "Camera access denied. Please grant permissions.";
        }
      }

      function stopCamera() {
        if (state.stream) {
          state.stream.getTracks().forEach(track => track.stop());
          state.stream = null;
        }
      }

      function flipCamera() {
        state.facingMode = state.facingMode === "user" ? "environment" : "user";
        startCamera();
      }

      // =========================================================================
      // 6. CONTINUOUS PHOTO CAPTURE & COMPOSITING (CAMERA REMAINS OPEN)
      // =========================================================================
      function capturePhoto() {
        if (!state.stream) return;

        // Visual shutter flash effect
        shutterFlash.classList.remove("opacity-0");
        shutterFlash.classList.add("opacity-90");
        setTimeout(() => {
          shutterFlash.classList.remove("opacity-90");
          shutterFlash.classList.add("opacity-0");
        }, 80);

        const width = video.videoWidth || 1080;
        const height = video.videoHeight || 1440;
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        // STEP 1: Draw the user's photo FIRST (with horizontal mirroring if front camera)
        if (state.facingMode === "user") {
          ctx.save();
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, width, height);
          ctx.restore();
        } else {
          ctx.drawImage(video, 0, 0, width, height);
        }

        // STEP 2: Draw the Graduation 2026 Frame ON TOP of the photo
        ctx.drawImage(frameImage, 0, 0, width, height);

        // Export high-quality Base64 JPEG
        const finalImage = canvas.toDataURL("image/jpeg", 0.90);

        // STEP 3: Store into global sessionPhotos array (newest first)
        sessionPhotos.unshift({
          id: Date.now(),
          dataUrl: finalImage,
          timestamp: new Date()
        });

        // STEP 4: Update circular Album/Gallery button thumbnail in the camera view
        updateGalleryButton();

        // STEP 5: SILENT BACKGROUND UPLOAD TO GOOGLE DRIVE (User stays on camera!)
        silentUploadToDrive(finalImage, state.userName);
      }

      // =========================================================================
      // 7. 100% SILENT BACKGROUND UPLOAD (NO POPUPS, NO DRIVE LINKS SHOWN)
      // =========================================================================
      async function silentUploadToDrive(imageBase64, userName) {
        const cleanName = (userName || "Guest").replace(/[^a-zA-Z0-9_-]/g, "_");
        const filename = `photo_${cleanName}_${Date.now()}.jpg`;

        // Payload matching Google Apps Script doPost() fields:
        // folderName, image, filename
        const payload = {
          folderName: userName || "Guest",
          image: imageBase64,
          filename: filename
        };

        const serializedPayload = JSON.stringify(payload);

        try {
          // Standard fetch sent as plain text to bypass CORS preflight
          const response = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: serializedPayload
          });

          // Silent check (never interrupt or alert user)
          if (!response.ok) {
            throw new Error("HTTP Status " + response.status);
          }
          console.log("[Photobooth] Photo silently uploaded to Google Drive folder:", userName);

        } catch (fetchError) {
          // Fallback with mode: 'no-cors' to guarantee delivery without browser CORS blocking
          try {
            await fetch(APPS_SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: serializedPayload
            });
            console.log("[Photobooth] Photo delivered silently via no-cors fallback.");
          } catch (err) {
            console.warn("[Photobooth] Silent background upload encountered an issue:", err);
          }
        }
      }

      // =========================================================================
      // 8. IN-APP GALLERY & FULLSCREEN LIGHTBOX PREVIEW LOGIC
      // =========================================================================
      function updateGalleryButton() {
        const total = sessionPhotos.length;
        if (total > 0) {
          galleryThumbPreview.src = sessionPhotos[0].dataUrl;
          galleryThumbPreview.classList.remove("hidden");
          galleryThumbPlaceholder.classList.add("hidden");

          galleryCountBadge.textContent = total;
          galleryCountBadge.classList.remove("hidden");
          galleryCountBadge.classList.add("flex");
        } else {
          galleryThumbPreview.classList.add("hidden");
          galleryThumbPlaceholder.classList.remove("hidden");
          galleryCountBadge.classList.add("hidden");
        }
      }

      function renderGalleryGrid() {
        const total = sessionPhotos.length;
        galleryHeaderCount.textContent = total;

        if (total === 0) {
          galleryEmptyState.classList.remove("hidden");
          galleryGrid.classList.add("hidden");
          galleryGrid.innerHTML = "";
          return;
        }

        galleryEmptyState.classList.add("hidden");
        galleryGrid.classList.remove("hidden");
        galleryGrid.innerHTML = "";

        // Build individual photo cards (clicking ANY photo opens Lightbox)
        sessionPhotos.forEach((photo, idx) => {
          const card = document.createElement("div");
          card.className = "btn-bounce group relative flex flex-col rounded-2xl border border-gold-500/25 bg-surface-850 p-2 shadow-lg cursor-pointer transition-transform";

          const imgContainer = document.createElement("div");
          imgContainer.className = "relative aspect-[3/4] w-full overflow-hidden rounded-xl bg-black";

          const img = document.createElement("img");
          img.src = photo.dataUrl;
          img.alt = `Graduation Shot ${total - idx}`;
          img.className = "h-full w-full object-cover transition-transform duration-200 group-hover:scale-105";

          // Expand badge overlay on card
          const viewBadge = document.createElement("div");
          viewBadge.className = "absolute bottom-2 right-2 flex h-7 w-7 items-center justify-center rounded-full bg-black/75 text-gold-400 border border-gold-500/40 shadow";
          viewBadge.innerHTML = `
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/>
            </svg>
          `;

          imgContainer.appendChild(img);
          imgContainer.appendChild(viewBadge);
          card.appendChild(imgContainer);

          // Clicking photo card opens Fullscreen Lightbox
          card.addEventListener("click", () => {
            openLightbox(idx);
          });

          galleryGrid.appendChild(card);
        });
      }

      // =========================================================================
      // 9. MASTER LIGHTBOX CONTROLS (ISOLATED FULLSCREEN OVERLAY)
      // =========================================================================
      function openLightbox(index) {
        if (!sessionPhotos[index]) return;
        currentLightboxIndex = index;

        // Set image source
        lightboxPhotoImg.src = sessionPhotos[index].dataUrl;

        // Activate fullscreen lightbox overlay with smooth Zoom & Fade In
        lightboxView.classList.add("lightbox-active");
      }

      function closeLightbox() {
        lightboxView.classList.remove("lightbox-active");
      }

      function downloadCurrentLightboxPhoto() {
        if (!sessionPhotos[currentLightboxIndex]) return;
        const photo = sessionPhotos[currentLightboxIndex];
        const link = document.createElement("a");
        const safeName = (state.userName || "Guest").replace(/[^a-zA-Z0-9_-]/g, "_");
        link.download = `${safeName}_Graduation_2026_shot${currentLightboxIndex + 1}.jpg`;
        link.href = photo.dataUrl;
        link.click();
      }

      // Close when clicking outside photograph
      lightboxView.addEventListener("click", (e) => {
        if (e.target === lightboxView || e.target.id === "lightbox-photo-container") {
          closeLightbox();
        }
      });

      // =========================================================================
      // 10. EVENT LISTENERS
      // =========================================================================
      // Login Form Submit
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = userNameInput.value.trim();
        if (!name) return;

        state.userName = name;
        headerUserName.textContent = name;
        headerUserTag.classList.remove("hidden");
        headerUserTag.classList.add("flex");
        logoutBtn.classList.remove("hidden");

        showView("camera-view");
        startCamera();
      });

      // Shutter Click (Continuous Back-to-Back Shots)
      shutterBtn.addEventListener("click", capturePhoto);

      // Flip Camera
      flipCamBtn.addEventListener("click", flipCamera);

      // Open Album / Gallery Slide-up View
      galleryOpenBtn.addEventListener("click", openGalleryPanel);

      // Back to Camera from Gallery
      galleryBackBtn.addEventListener("click", closeGalleryPanel);

      // Lightbox Close Button
      lightboxCloseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        closeLightbox();
      });

      // Lightbox Download Button
      lightboxDownloadBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        downloadCurrentLightboxPhoto();
      });

      // Exit / Switch Guest
      logoutBtn.addEventListener("click", () => {
        stopCamera();
        state.userName = "";
        sessionPhotos.length = 0; // Clear session album for next guest
        updateGalleryButton();
        closeGalleryPanel();
        closeLightbox();
        headerUserTag.classList.add("hidden");
        logoutBtn.classList.add("hidden");
        userNameInput.value = "";
        showView("login-view");
      });

    })();
  </script>
</body>
</html>
