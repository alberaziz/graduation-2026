<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class of 2026 - Graduation Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-3 font-sans">

  <!-- صندوق تنبيه الكاميرا -->
  <div id="errorBox" class="hidden max-w-sm w-full bg-red-900/80 border border-red-500 p-3 rounded-xl mb-3 text-center text-xs text-red-200"></div>

  <!-- الشاشة الأولى: الكاميرا والفريم الحي -->
  <div id="cameraView" class="w-full max-w-sm flex flex-col items-center">
    <div class="relative w-full aspect-square bg-neutral-900 rounded-2xl overflow-hidden shadow-2xl border border-amber-500/20">
      <video id="video" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
      <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
    </div>

    <!-- زرار الالتقاط -->
    <button id="snapBtn" class="mt-6 w-20 h-20 rounded-full border-4 border-amber-400 flex items-center justify-center bg-black hover:bg-neutral-900 active:scale-95 transition-all shadow-lg shadow-amber-500/20">
      <div class="w-14 h-14 rounded-full bg-amber-400"></div>
    </button>
  </div>

  <!-- الشاشة الثانية: المعاينة المؤقتة (بدون أي أزرار) -->
  <div id="resultView" class="hidden w-full max-w-sm flex flex-col items-center">
    <div id="statusBadge" class="mb-3 px-4 py-1.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-400/30 flex items-center gap-2">
      <span class="animate-spin inline-block w-3 h-3 border-2 border-current border-t-transparent rounded-full"></span>
      جاري حفظ صورتك في ألبوم التخرج...
    </div>

    <!-- عرض النتيجة النهائية -->
    <div class="w-full aspect-square rounded-2xl overflow-hidden shadow-2xl border border-amber-500/30">
      <img id="finalPreview" class="w-full h-full object-cover" alt="Graduation Photo">
    </div>

    <p id="timerNotice" class="mt-4 text-xs text-neutral-400 text-center flex items-center justify-center gap-1.5">
      <span>ألف مبروك! جاري الرجوع للكاميرا خلال لحظات...</span>
    </p>
  </div>

  <canvas id="compositeCanvas" class="hidden"></canvas>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJqgbbH2UBN-KzefwQspwHAU-iIx-W0gbcBGafuoFNNdzqT5lTlV3-C1lp8KCjuIhH/exec";

    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snapBtn');
    const cameraView = document.getElementById('cameraView');
    const resultView = document.getElementById('resultView');
    const finalPreview = document.getElementById('finalPreview');
    const statusBadge = document.getElementById('statusBadge');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const canvas = document.getElementById('compositeCanvas');
    const ctx = canvas.getContext('2d');
    const errorBox = document.getElementById('errorBox');

    let processedFrameCanvas = null;
    let autoResetTimer = null;

    // 1. تفريغ الفريم تلقائياً
    function processFrame(img) {
      const c = document.createElement('canvas');
      const size = 900;
      c.width = size;
      c.height = size;
      const fCtx = c.getContext('2d');
      fCtx.drawImage(img, 0, 0, size, size);

      const imgData = fCtx.getImageData(0, 0, size, size);
      const data = imgData.data;

      const minX = size * 0.15;
      const maxX = size * 0.85;
      const minY = size * 0.08;
      const maxY = size * 0.81;

      for (let y = Math.floor(minY); y < maxY; y++) {
        for (let x = Math.floor(minX); x < maxX; x++) {
          const idx = (y * size + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          if (r < 50 && g < 50 && b < 50) {
            data[idx + 3] = 0;
          }
        }
      }

      fCtx.putImageData(imgData, 0, 0);
      processedFrameCanvas = c;

      overlayCanvas.width = overlayCanvas.clientWidth || 360;
      overlayCanvas.height = overlayCanvas.clientHeight || 360;
      overlayCtx.drawImage(processedFrameCanvas, 0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    const frameImg = new Image();
    frameImg.crossOrigin = "anonymous";
    frameImg.onload = () => processFrame(frameImg);
    frameImg.src = 'frame.jpg';
    if (frameImg.complete) processFrame(frameImg);

    // 2. تشغيل الكاميرا الأمامية
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        errorBox.classList.remove('hidden');
        errorBox.innerHTML = '⚠️ يرجى السماح بصلاحية الكاميرا من إعدادات المتصفح.';
      }
    }
    startCamera();

    // 3. دالة الرجوع للكاميرا وإعادة التهيئة
    async function resetToCamera() {
      if (autoResetTimer) clearTimeout(autoResetTimer);
      
      resultView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      snapBtn.disabled = false;

      // إعادة ضبط رسالة التحميل
      statusBadge.innerHTML = '<span class="animate-spin inline-block w-3 h-3 border-2 border-current border-t-transparent rounded-full"></span> جاري حفظ صورتك في ألبوم التخرج...';
      statusBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-400/30 flex items-center gap-2';

      try {
        if (video.srcObject && video.srcObject.active) {
          await video.play();
        } else {
          await startCamera();
        }
      } catch (e) {
        await startCamera();
      }
    }

    // الاستجابة لزر Back في التليفون
    window.addEventListener('popstate', (e) => {
      if (!resultView.classList.contains('hidden')) {
        resetToCamera();
      }
    });

    // 4. التقاط ودمج ورفع الصورة
    snapBtn.addEventListener('click', async () => {
      snapBtn.disabled = true;

      // إضافة حالة في تاريخ المتصفح عشان زر الـ Back يشتغل محلياً
      history.pushState({ view: 'result' }, '');

      const size = 1080;
      canvas.width = size;
      canvas.height = size;

      // قص مربع من منتصف الفيديو لمنع المط
      const vw = video.videoWidth || 1080;
      const vh = video.videoHeight || 1080;
      const minDim = Math.min(vw, vh);
      const sx = (vw - minDim) / 2;
      const sy = (vh - minDim) / 2;

      ctx.save();
      ctx.translate(size, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, size, size);
      ctx.restore();

      // رسم الفريم فوق الصورة
      if (processedFrameCanvas) {
        ctx.drawImage(processedFrameCanvas, 0, 0, size, size);
      } else {
        ctx.drawImage(frameImg, 0, 0, size, size);
      }

      // إظهار الصورة فوراً
      const base64Image = canvas.toDataURL('image/jpeg', 0.88);
      finalPreview.src = base64Image;
      cameraView.classList.add('hidden');
      resultView.classList.remove('hidden');

      // إيقاف مؤقت لحركة الفيديو
      video.pause();

      // الرفع لجوجل درايف في الخلفية
      try {
        const filename = `Grad_2026_${Date.now()}.jpg`;
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image, filename: filename })
        });

        statusBadge.innerHTML = '✅ تم الحفظ في ألبوم الدفعة بنجاح!';
        statusBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 flex items-center gap-2';
      } catch (err) {
        statusBadge.innerHTML = '⚠️ حدث خطأ أثناء الحفظ بالسيرفر';
      }

      // الرجوع للكاميرا تلقائياً بعد 4 ثوانٍ
      autoResetTimer = setTimeout(() => {
        if (!resultView.classList.contains('hidden')) {
          if (history.state && history.state.view === 'result') {
            history.back(); // يستدعي popstate ويرجع للكاميرا بنظافة
          } else {
            resetToCamera();
          }
        }
      }, 4000);
    });
  </script>
</body>
</html>
