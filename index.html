<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class of 2026 - Graduation Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-3 font-sans">

  <!-- الشاشة الأولى: الكاميرا مع الفريم الحي -->
  <div id="cameraView" class="w-full max-w-sm flex flex-col items-center">
    <div class="relative w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-amber-500/20">
      <!-- بث الكاميرا -->
      <video id="video" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
      
      <!-- الفريم المفرغ برمجياً يظهر هنا لايف -->
      <img id="overlayPreview" alt="Graduation Frame" class="absolute inset-0 w-full h-full pointer-events-none object-fill z-10 transition-opacity duration-300 opacity-0">
    </div>

    <!-- زرار الالتقاط -->
    <button id="snapBtn" class="mt-6 w-20 h-20 rounded-full border-4 border-amber-400 flex items-center justify-center bg-black hover:bg-neutral-900 active:scale-95 transition-all shadow-lg shadow-amber-500/20">
      <div class="w-14 h-14 rounded-full bg-amber-400"></div>
    </button>
  </div>

  <!-- الشاشة الثانية: النتيجة والرفع التلقائي -->
  <div id="resultView" class="hidden w-full max-w-sm flex flex-col items-center">
    <div id="statusBadge" class="mb-3 px-4 py-1.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-400/30 flex items-center gap-2">
      <span class="animate-spin inline-block w-3 h-3 border-2 border-current border-t-transparent rounded-full"></span>
      جاري حفظ صورتك في ألبوم الدفعة...
    </div>

    <!-- النتيجة النهائية المدمجة -->
    <div class="w-full aspect-square rounded-2xl overflow-hidden shadow-2xl border border-amber-500/30">
      <img id="finalPreview" class="w-full h-full object-cover" alt="Graduation Photo">
    </div>

    <p class="mt-4 text-xs text-neutral-400 text-center">ألف مبروك التخرج! 🎉 صورتك اتحفظت تلقائياً في درايف الدفعة.</p>
  </div>

  <canvas id="compositeCanvas" class="hidden"></canvas>

  <script>
    // ⚠️ ضع رابط تطبيق الويب الخاص بك هنا
    const GOOGLE_SCRIPT_URL = "GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJqgbbH2UBN-KzefwQspwHAU-iIx-W0gbcBGafuoFNNdzqT5lTlV3-C1lp8KCjuIhH/exec";";

    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snapBtn');
    const cameraView = document.getElementById('cameraView');
    const resultView = document.getElementById('resultView');
    const finalPreview = document.getElementById('finalPreview');
    const statusBadge = document.getElementById('statusBadge');
    const overlayPreview = document.getElementById('overlayPreview');
    const canvas = document.getElementById('compositeCanvas');
    const ctx = canvas.getContext('2d');

    let processedFrameCanvas = null;

    // تحميل وتفريغ قلب الفريم الأسود أوتوماتيكياً
    const frameImg = new Image();
    frameImg.src = 'frame.jpg';
    frameImg.onload = () => {
      processedFrameCanvas = createAutoTransparentFrame(frameImg);
      overlayPreview.src = processedFrameCanvas.toDataURL('image/png');
      overlayPreview.classList.remove('opacity-0');
    };

    function createAutoTransparentFrame(img) {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || 1080;
      c.height = img.naturalHeight || 1080;
      const fCtx = c.getContext('2d');
      fCtx.drawImage(img, 0, 0, c.width, c.height);

      const imgData = fCtx.getImageData(0, 0, c.width, c.height);
      const data = imgData.data;

      // حدود المربع الداخلي للفريم
      const minX = c.width * 0.15;
      const maxX = c.width * 0.85;
      const minY = c.height * 0.08;
      const maxY = c.height * 0.81;

      for (let y = Math.floor(minY); y < maxY; y++) {
        for (let x = Math.floor(minX); x < maxX; x++) {
          const idx = (y * c.width + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          // تفريغ الأسود فقط والإبقاء على الإطار الذهبي والتفاصيل
          if (r < 45 && g < 45 && b < 45) {
            data[idx + 3] = 0; // جعل البكسل شفاف
          }
        }
      }

      fCtx.putImageData(imgData, 0, 0);
      return c;
    }

    // تشغيل الكاميرا الأمامية
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("يرجى تفعيل صلاحية الكاميرا للتصوير.");
      }
    }
    startCamera();

    // التقاط ودمج ورفع الصورة تلقائياً
    snapBtn.addEventListener('click', async () => {
      snapBtn.disabled = true;

      const size = 1080;
      canvas.width = size;
      canvas.height = size;

      // 1. رسم لقطة الكاميرا في الخلفية معكوسة كمرآة طبيعية
      ctx.save();
      ctx.translate(size, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, size, size);
      ctx.restore();

      // 2. رسم الفريم المفرغ فوق الكاميرا
      if (processedFrameCanvas) {
        ctx.drawImage(processedFrameCanvas, 0, 0, size, size);
      } else {
        ctx.drawImage(frameImg, 0, 0, size, size);
      }

      // 3. عرض النتيجة فوراً للمستخدم
      const base64Image = canvas.toDataURL('image/jpeg', 0.88);
      finalPreview.src = base64Image;
      cameraView.classList.add('hidden');
      resultView.classList.remove('hidden');

      // إيقاف الكاميرا لتوفير طاقة الموبايل
      const stream = video.srcObject;
      if (stream) stream.getTracks().forEach(track => track.stop());

      // 4. الرفع التلقائي إلى Google Drive
      try {
        const filename = `Grad_2026_${Date.now()}.jpg`;
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image, filename: filename })
        });

        statusBadge.innerHTML = '✅ تم الحفظ في ألبوم الدفعة بنجاح!';
        statusBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 flex items-center gap-2';
      } catch (err) {
        console.error(err);
        statusBadge.innerHTML = '⚠️ حدث خطأ أثناء الحفظ بالسيرفر';
      }
    });
  </script>
</body>
</html>
