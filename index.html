<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class of 2026 - Graduation Booth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-[100dvh] w-full overflow-hidden select-none font-sans relative flex flex-col justify-between">

  <!-- شريط المعلومات العلوي -->
  <div class="absolute top-0 inset-x-0 z-30 flex items-center justify-between px-5 pt-4 pb-6 bg-gradient-to-b from-black/80 to-transparent text-xs tracking-widest font-mono">
    <span class="text-amber-300 font-bold">CLASS OF 2026</span>
    
    <span id="uploadStatus" class="text-emerald-400 opacity-0 transition-opacity duration-300 flex items-center gap-1.5">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      Saved to Drive
    </span>

    <!-- زر تبديل الاستيكر لايف -->
    <button id="switchLogoBtn" class="px-3.5 py-1.5 rounded-full bg-black/70 border border-white/20 text-[11px] font-bold text-amber-300 active:scale-95 transition-all shadow-lg backdrop-blur-sm">
      ✨ Change Sticker
    </button>
  </div>

  <!-- تنبيه الكاميرا -->
  <div id="errorBox" class="hidden absolute top-16 inset-x-4 z-40 bg-red-900/90 border border-red-500 p-3 rounded-2xl text-center text-xs text-red-200"></div>

  <!-- مساحة الكاميرا الحية مع الاستيكر المباشر -->
  <div class="relative w-full h-full overflow-hidden bg-neutral-950 flex items-center justify-center">
    <video id="video" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
    
    <!-- الاستيكر الحي التفاعلي فوق الكاميرا -->
    <img id="liveSticker" src="logo1.png" alt="Live Sticker" class="absolute pointer-events-none z-20 transition-all duration-200 object-contain">
    
    <!-- وميض الفلاش -->
    <div id="flashEffect" class="absolute inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-150 z-20"></div>
  </div>

  <!-- شريط التحكم السفلي -->
  <div class="absolute bottom-0 inset-x-0 z-30 flex items-center justify-around px-5 pt-10 pb-8 bg-gradient-to-t from-black/95 via-black/50 to-transparent">
    
    <!-- مصغرة المعرض -->
    <div class="relative w-14 h-14 flex items-center justify-center">
      <button id="galleryThumbBtn" class="w-13 h-13 rounded-2xl border-2 border-white/40 overflow-hidden bg-neutral-900 active:scale-90 transition-transform">
        <img id="thumbImg" src="" class="hidden w-full h-full object-cover" alt="Gallery">
        <div id="emptyThumbIcon" class="text-xl text-neutral-500 flex items-center justify-center h-full">🖼️</div>
      </button>
      <span id="galleryBadge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-black px-1.5 py-0.5 rounded-full shadow">0</span>
    </div>

    <!-- زر الالتقاط مع عداد الصور للجلسة -->
    <div class="relative flex items-center justify-center">
      <button id="snapBtn" class="w-20 h-20 rounded-full border-4 border-amber-400 flex items-center justify-center bg-black active:scale-95 transition-all shadow-lg shadow-amber-500/20">
        <div class="w-14 h-14 rounded-full bg-amber-400 active:bg-amber-300"></div>
      </button>
      <span id="sessionCounter" class="hidden absolute -top-2 bg-amber-400 text-black text-xs font-black px-2.5 py-0.5 rounded-full shadow">0/4</span>
    </div>

    <!-- زر قلب الكاميرا أو زر Done -->
    <div class="w-14 h-14 flex items-center justify-center">
      <button id="flipBtn" class="w-14 h-14 rounded-2xl bg-neutral-900/80 border border-white/20 flex items-center justify-center active:scale-90 transition-transform text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <!-- يظهر زر Done بعد التقاط أول صورة -->
      <button id="doneBtn" class="hidden px-3.5 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-black font-black text-xs uppercase tracking-wider active:scale-90 transition-all shadow-lg shadow-emerald-500/30">
        Done
      </button>
    </div>
  </div>

  <!-- شاشة المعرض الكامل للصور -->
  <div id="galleryModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col justify-between p-4">
    <div class="w-full flex items-center justify-between pt-2 pb-4 border-b border-neutral-800">
      <button id="closeGalleryBtn" class="px-4 py-1.5 bg-neutral-900 rounded-full text-xs text-amber-300 font-bold border border-neutral-700 active:scale-95">
        Back to Camera
      </button>
      <span id="galleryCounter" class="text-xs text-neutral-400 font-mono">1 / 1</span>
      <a id="downloadPhotoBtn" download="grad-photobooth.jpg" class="px-5 py-1.5 bg-amber-500 hover:bg-amber-400 text-black rounded-full text-xs font-bold active:scale-95">
        Download
      </a>
    </div>

    <div class="relative flex-1 flex items-center justify-center p-2">
      <img id="galleryMainImg" class="max-w-full max-h-[72vh] object-contain rounded-2xl shadow-2xl border border-neutral-800" alt="Collage Strip">
    </div>

    <div class="w-full flex items-center justify-between px-6 pb-4">
      <button id="prevPhotoBtn" class="w-12 h-12 rounded-full bg-neutral-900 border border-neutral-700 text-lg flex items-center justify-center active:scale-90">❮</button>
      <span class="text-[11px] text-neutral-500">Graduation Memories</span>
      <button id="nextPhotoBtn" class="w-12 h-12 rounded-full bg-neutral-900 border border-neutral-700 text-lg flex items-center justify-center active:scale-90">❯</button>
    </div>
  </div>

  <canvas id="compositeCanvas" class="hidden"></canvas>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJqgbbH2UBN-KzefwQspwHAU-iIx-W0gbcBGafuoFNNdzqT5lTlV3-C1lp8KCjuIhH/exec";

    const video = document.getElementById('video');
    const liveSticker = document.getElementById('liveSticker');
    const switchLogoBtn = document.getElementById('switchLogoBtn');
    const canvas = document.getElementById('compositeCanvas');
    const ctx = canvas.getContext('2d');

    const snapBtn = document.getElementById('snapBtn');
    const flipBtn = document.getElementById('flipBtn');
    const doneBtn = document.getElementById('doneBtn');
    const sessionCounter = document.getElementById('sessionCounter');
    const flashEffect = document.getElementById('flashEffect');
    const uploadStatus = document.getElementById('uploadStatus');
    const errorBox = document.getElementById('errorBox');

    const galleryThumbBtn = document.getElementById('galleryThumbBtn');
    const thumbImg = document.getElementById('thumbImg');
    const emptyThumbIcon = document.getElementById('emptyThumbIcon');
    const galleryBadge = document.getElementById('galleryBadge');
    const galleryModal = document.getElementById('galleryModal');
    const closeGalleryBtn = document.getElementById('closeGalleryBtn');
    const galleryMainImg = document.getElementById('galleryMainImg');
    const galleryCounter = document.getElementById('galleryCounter');
    const downloadPhotoBtn = document.getElementById('downloadPhotoBtn');
    const prevPhotoBtn = document.getElementById('prevPhotoBtn');
    const nextPhotoBtn = document.getElementById('nextPhotoBtn');

    let currentFacingMode = 'user';
    let sessionShots = [];
    let savedCollages = [];
    let currentGalleryIndex = 0;
    let lastUsedFrame = {};

    // 1. نظام الاستيكرات المباشر وتحديد موضع كل استيكر
    const STICKERS = [
      { id: 0, src: 'logo1.png', style: 'bottom: 10%; left: 50%; transform: translateX(-50%); width: 44%; max-height: 25%;' },
      { id: 1, src: 'logo2.png', style: 'right: 5%; top: 50%; transform: translateY(-50%); height: 42%; width: auto;' },
      { id: 2, src: 'logo3.png', style: 'left: 6%; bottom: 22%; width: 42%; max-height: 35%;' },
      { id: 3, src: 'logo4.png', style: 'top: 6%; left: 50%; transform: translateX(-50%); width: 62%; max-height: 25%;' },
      { id: 4, src: 'logo5.png', style: 'bottom: 22%; left: 50%; transform: translateX(-50%); width: 55%; max-height: 25%;' }
    ];

    let activeStickerIdx = Math.floor(Math.random() * STICKERS.length);

    // تحميل مسبق لصور الاستيكرات
    const loadedStickerImgs = {};
    STICKERS.forEach(s => {
      const img = new Image();
      img.src = s.src;
      loadedStickerImgs[s.id] = img;
    });

    function applyLiveSticker() {
      const s = STICKERS[activeStickerIdx];
      liveSticker.src = s.src;
      liveSticker.style.cssText = s.style;
    }
    applyLiveSticker();

    switchLogoBtn.addEventListener('click', () => {
      activeStickerIdx = (activeStickerIdx + 1) % STICKERS.length;
      applyLiveSticker();
    });

    // 2. مكتبة الفريمات مع زوايا الدوران (Angles) ومراكز الكروت (Centers)
    const FRAMES_CONFIG = {
      1: [
        { 
          src: 'f1_1.png', 
          slots: [{ cx: 540, cy: 900, w: 860, h: 1050, rot: 0 }] 
        },
        { 
          src: 'f1_2.png', 
          slots: [{ cx: 540, cy: 820, w: 840, h: 1020, rot: 0 }] 
        },
        { 
          src: 'f1_3.png', 
          slots: [{ cx: 540, cy: 920, w: 860, h: 1050, rot: 0 }] 
        }
      ],
      2: [
        { 
          src: 'f2_1.png', // كروت بولارويد مائلة
          slots: [
            { cx: 350, cy: 460, w: 600, h: 620, rot: -8 }, // الكارت العلوي مائل لليسار
            { cx: 520, cy: 1260, w: 600, h: 620, rot: 6 }   // الكارت السفلي مائل لليمين
          ] 
        },
        { 
          src: 'f2_2.png', 
          slots: [
            { cx: 540, cy: 550, w: 860, h: 720, rot: 0 },
            { cx: 540, cy: 1320, w: 860, h: 720, rot: 0 }
          ] 
        },
        { 
          src: 'f2_3.png', 
          slots: [
            { cx: 480, cy: 580, w: 620, h: 640, rot: -4 },
            { cx: 560, cy: 1300, w: 620, h: 640, rot: 4 }
          ] 
        }
      ],
      3: [
        { 
          src: 'f3_1.png', 
          slots: [
            { cx: 540, cy: 420, w: 840, h: 520, rot: 0 },
            { cx: 540, cy: 930, w: 840, h: 520, rot: 0 },
            { cx: 540, cy: 1440, w: 840, h: 520, rot: 0 }
          ] 
        },
        { 
          src: 'f3_2.png', 
          slots: [
            { cx: 540, cy: 430, w: 880, h: 530, rot: 0 },
            { cx: 540, cy: 950, w: 880, h: 530, rot: 0 },
            { cx: 540, cy: 1470, w: 880, h: 530, rot: 0 }
          ] 
        }
      ],
      4: [
        { 
          src: 'f4_1.png', // فريم البولارويد الـ 4 المائل مع الديسكو والكاميرا
          slots: [
            { cx: 420, cy: 415, w: 420, h: 440, rot: -7 },   // أعلى يسار مائل -7 درجات
            { cx: 680, cy: 635, w: 420, h: 440, rot: 15 },   // وسط يمين مائل +15 درجة
            { cx: 285, cy: 1380, w: 420, h: 440, rot: -5 },  // أسفل يسار مائل -5 درجات
            { cx: 680, cy: 1550, w: 420, h: 440, rot: 7 }    // أسفل يمين مائل +7 درجات
          ] 
        },
        { 
          src: 'f4_2.png', // فريم الـ 4 الممزق (شبكة متناسقة)
          slots: [
            { cx: 270, cy: 480, w: 540, h: 960, rot: 0 },
            { cx: 810, cy: 480, w: 540, h: 960, rot: 0 },
            { cx: 270, cy: 1440, w: 540, h: 960, rot: 0 },
            { cx: 810, cy: 1440, w: 540, h: 960, rot: 0 }
          ] 
        }
      ]
    };

    const loadedFrameImgs = {};
    Object.keys(FRAMES_CONFIG).forEach(c => {
      FRAMES_CONFIG[c].forEach(f => {
        const img = new Image();
        img.src = f.src;
        loadedFrameImgs[f.src] = img;
      });
    });

    // 3. تشغيل الكاميرا
    async function startCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        if (currentFacingMode === 'user') video.classList.add('-scale-x-100');
        else video.classList.remove('-scale-x-100');
      } catch (err) {
        errorBox.classList.remove('hidden');
        errorBox.textContent = 'Please enable camera permissions.';
      }
    }
    startCamera();

    flipBtn.addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      await startCamera();
    });

    // رسم الاستيكر المختار داخل الصورة عند التقاطها
    function stampStickerOnPhoto(tCtx, stickerId, w, h) {
      const stImg = loadedStickerImgs[stickerId];
      if (!stImg || !stImg.complete || stImg.naturalWidth === 0) return;

      const aspect = stImg.naturalWidth / stImg.naturalHeight;
      let dw, dh, dx, dy;

      switch(stickerId) {
        case 0: // logo1: bottom center
          dw = w * 0.44;
          dh = dw / aspect;
          dx = (w - dw) / 2;
          dy = h - dh - (h * 0.10);
          break;
        case 1: // logo2: right vertical
          dh = h * 0.42;
          dw = dh * aspect;
          dx = w - dw - (w * 0.05);
          dy = (h - dh) / 2;
          break;
        case 2: // logo3: left ~25% from bottom
          dw = w * 0.42;
          dh = dw / aspect;
          dx = w * 0.06;
          dy = (h * 0.78) - dh;
          break;
        case 3: // logo4: top center
          dw = w * 0.62;
          dh = dw / aspect;
          dx = (w - dw) / 2;
          dy = h * 0.06;
          break;
        case 4: // logo5: center ~25% from bottom
          dw = w * 0.55;
          dh = dw / aspect;
          dx = (w - dw) / 2;
          dy = (h * 0.78) - (dh / 2);
          break;
      }
      tCtx.drawImage(stImg, dx, dy, dw, dh);
    }

    // 4. التقاط اللقطة مع الاستيكر
    snapBtn.addEventListener('click', () => {
      flashEffect.style.opacity = '0.85';
      setTimeout(() => { flashEffect.style.opacity = '0'; }, 120);

      const shotCanvas = document.createElement('canvas');
      const w = 1080;
      const h = 1350; // أبعاد صورة مربعة-مستطيلة مثالية للبولارويد
      shotCanvas.width = w;
      shotCanvas.height = h;
      const sCtx = shotCanvas.getContext('2d');

      const vw = video.videoWidth || 1080;
      const vh = video.videoHeight || 1080;
      const sRatio = vw / vh;
      const dRatio = w / h;
      let sx, sy, sCropW, sCropH;

      if (sRatio > dRatio) {
        sCropH = vh;
        sCropW = vh * dRatio;
        sx = (vw - sCropW) / 2;
        sy = 0;
      } else {
        sCropW = vw;
        sCropH = vw / dRatio;
        sx = 0;
        sy = (vh - sCropH) / 2;
      }

      sCtx.save();
      if (currentFacingMode === 'user') {
        sCtx.translate(w, 0);
        sCtx.scale(-1, 1);
      }
      sCtx.drawImage(video, sx, sy, sCropW, sCropH, 0, 0, w, h);
      sCtx.restore();

      // دمج الاستيكر الحي النشط فوق الصورة
      stampStickerOnPhoto(sCtx, activeStickerIdx, w, h);

      sessionShots.push(shotCanvas);

      sessionCounter.classList.remove('hidden');
      sessionCounter.textContent = `${sessionShots.length}/4`;
      flipBtn.classList.add('hidden');
      doneBtn.classList.remove('hidden');

      if (sessionShots.length === 4) {
        buildCollageAndFinalize();
      }
    });

    doneBtn.addEventListener('click', () => {
      if (sessionShots.length > 0) buildCollageAndFinalize();
    });

    // 5. دمج الصور مع التدوير الحقيقي (Rotation) ومنع تكرار الفريم
    function buildCollageAndFinalize() {
      const count = Math.min(Math.max(sessionShots.length, 1), 4);
      const pool = FRAMES_CONFIG[count];

      // خوارزمية منع تكرار نفس الفريم مرتين متتاليتين
      let availableFrames = pool;
      if (pool.length > 1 && lastUsedFrame[count]) {
        availableFrames = pool.filter(f => f.src !== lastUsedFrame[count]);
      }
      const selectedFrame = availableFrames[Math.floor(Math.random() * availableFrames.length)];
      lastUsedFrame[count] = selectedFrame.src;

      const targetW = 1080;
      const targetH = 1920;
      canvas.width = targetW;
      canvas.height = targetH;
      ctx.clearRect(0, 0, targetW, targetH);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, targetW, targetH);

      // رسم كل صورة مع زاوية ميلانها المحددة (Rotate & Translate)
      selectedFrame.slots.forEach((slot, i) => {
        const shot = sessionShots[i];
        if (shot) {
          ctx.save();
          // الانتقال لمركز كارت البولارويد
          ctx.translate(slot.cx, slot.cy);
          // تدوير الكانفاس بزاوية الكارت
          if (slot.rot) {
            ctx.rotate((slot.rot * Math.PI) / 180);
          }
          // رسم الصورة متمركزة وممتدة تحت حواف البولارويد
          ctx.drawImage(shot, -slot.w / 2, -slot.h / 2, slot.w, slot.h);
          ctx.restore();
        }
      });

      // رسم الفريم المفرغ في النهاية فوق كل الصور
      const frameImg = loadedFrameImgs[selectedFrame.src];
      if (frameImg && frameImg.complete && frameImg.naturalWidth > 0) {
        ctx.drawImage(frameImg, 0, 0, targetW, targetH);
      }

      const finalDataUrl = canvas.toDataURL('image/jpeg', 0.92);
      savedCollages.unshift(finalDataUrl);
      updateGalleryThumb();

      openGalleryAt(0);

      // حفظ في درايف
      uploadStatus.style.opacity = '1';
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: finalDataUrl, filename: `Grad_${count}Shots_${Date.now()}.jpg` })
      }).finally(() => {
        setTimeout(() => { uploadStatus.style.opacity = '0'; }, 3000);
      });

      // تصفير الجلسة
      sessionShots = [];
      sessionCounter.classList.add('hidden');
      doneBtn.classList.add('hidden');
      flipBtn.classList.remove('hidden');
    }

    // 6. المعرض والتنزيل
    function updateGalleryThumb() {
      if (savedCollages.length > 0) {
        thumbImg.src = savedCollages[0];
        thumbImg.classList.remove('hidden');
        emptyThumbIcon.classList.add('hidden');
        galleryBadge.textContent = savedCollages.length;
        galleryBadge.classList.remove('hidden');
      }
    }

    function openGalleryAt(index) {
      currentGalleryIndex = index;
      galleryMainImg.src = savedCollages[currentGalleryIndex];
      downloadPhotoBtn.href = savedCollages[currentGalleryIndex];
      galleryCounter.textContent = `${currentGalleryIndex + 1} / ${savedCollages.length}`;
      galleryModal.classList.remove('hidden');
      history.pushState({ gallery: true }, '');
    }

    galleryThumbBtn.addEventListener('click', () => {
      if (savedCollages.length > 0) openGalleryAt(0);
    });

    closeGalleryBtn.addEventListener('click', () => {
      galleryModal.classList.add('hidden');
    });

    window.addEventListener('popstate', () => {
      galleryModal.classList.add('hidden');
    });

    prevPhotoBtn.addEventListener('click', () => {
      if (currentGalleryIndex > 0) openGalleryAt(currentGalleryIndex - 1);
    });

    nextPhotoBtn.addEventListener('click', () => {
      if (currentGalleryIndex < savedCollages.length - 1) openGalleryAt(currentGalleryIndex + 1);
    });
  </script>
</body>
</html>
