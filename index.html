<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0a0a0e] text-[#f3f4f6]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Graduate 2026 - Church of the Virgin Mary & St. Mina Photobooth</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              300: '#fde68a',
              400: '#f6d365',
              500: '#d4af37',
              600: '#b89228',
              700: '#8c6d1a',
            },
            surface: {
              900: '#0a0a0e',
              850: '#101117',
              800: '#161821',
              700: '#222533',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    /* Lightweight mobile-optimized transitions - STRICTLY zero blur filters */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input {
      user-select: text;
    }
    .view-transition {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .shutter-flash {
      transition: opacity 0.08s ease-out;
    }
    @keyframes spin-fast {
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin-fast 0.8s linear infinite;
    }
    /* Front-camera mirror */
    .mirrored {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden bg-[#0a0a0e] font-sans antialiased text-neutral-200">

  <!-- Mobile Wrapper Container (Full screen on phones, framed elegantly on desktop) -->
  <div class="relative mx-auto flex h-full w-full max-w-md flex-col overflow-hidden bg-surface-900 shadow-2xl border-x border-neutral-900">

    <!-- Top Status / Branding Bar -->
    <header class="relative z-30 flex h-14 shrink-0 items-center justify-between border-b border-gold-500/20 bg-surface-850 px-4">
      <div class="flex items-center space-x-2.5">
        <div class="flex h-7 w-7 items-center justify-center rounded-full bg-gradient-to-tr from-gold-600 to-gold-400 text-black shadow-sm">
          <!-- Graduation Cap Icon -->
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
          </svg>
        </div>
        <span class="text-sm font-bold tracking-wider text-gold-400 uppercase">GRADUATE 2026</span>
      </div>

      <!-- Active User Badge (Right Header - Settings button completely removed) -->
      <div id="header-user-tag" class="hidden items-center space-x-1.5 rounded-full border border-gold-500/25 bg-surface-800 px-3 py-1 text-xs text-neutral-300">
        <span class="h-1.5 w-1.5 rounded-full bg-gold-400"></span>
        <span id="header-user-name" class="max-w-[130px] truncate font-medium">Guest</span>
      </div>
    </header>

    <!-- Camera Shutter Flash (Pure CSS opacity, ultra-lightweight) -->
    <div id="shutter-flash-overlay" class="pointer-events-none absolute inset-0 z-50 bg-white opacity-0 shutter-flash"></div>

    <!-- MAIN VIEWPORT CONTAINER -->
    <main class="relative flex-1 overflow-hidden">

      <!-- ========================================== -->
      <!-- VIEW 1: LOGIN VIEW                         -->
      <!-- ========================================== -->
      <section id="login-view" class="view-transition absolute inset-0 flex flex-col justify-center p-6 opacity-100 z-10">
        <div class="flex flex-col items-center text-center">
          <!-- Elegant Graduation Monogram Emblem -->
          <div class="relative mb-6 flex h-20 w-20 items-center justify-center rounded-2xl border border-gold-500/30 bg-surface-850 shadow-lg">
            <div class="absolute inset-1 rounded-xl border border-gold-500/10"></div>
            <svg class="h-10 w-10 text-gold-400" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
            </svg>
          </div>

          <!-- Main Heading -->
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white leading-snug">
            Church Of The Virgin Mary and St. Mina
          </h1>

          <!-- Login Form (No subtitle, no input placeholder, no helper text) -->
          <form id="login-form" class="mt-8 w-full space-y-5">
            <div class="text-left">
              <label for="user-name-input" class="block text-xs font-semibold uppercase tracking-wider text-gold-400/90 mb-2 ml-1">
                Your Full Name
              </label>
              <input
                type="text"
                id="user-name-input"
                required
                placeholder=""
                autocomplete="name"
                class="w-full rounded-xl border border-neutral-800 bg-surface-850 px-4 py-3.5 text-sm text-white transition-colors focus:border-gold-500 focus:outline-none"
              />
            </div>

            <button
              type="submit"
              class="w-full rounded-xl bg-gradient-to-r from-gold-600 via-gold-500 to-gold-400 py-3.5 text-sm font-semibold text-black tracking-wide shadow-md transition-transform duration-150 active:scale-95 hover:brightness-105"
            >
              Enter Photobooth
            </button>
          </form>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- VIEW 2: CAMERA VIEW                        -->
      <!-- ========================================== -->
      <section id="camera-view" class="view-transition absolute inset-0 flex flex-col justify-between opacity-0 pointer-events-none z-0">
        <!-- Live Video Viewfinder with Frame Overlay -->
        <div class="relative flex-1 overflow-hidden bg-black flex items-center justify-center">
          <!-- Live Camera Video -->
          <video
            id="camera-stream"
            autoplay
            playsinline
            muted
            class="h-full w-full object-cover mirrored"
          ></video>

          <!-- Transparent Graduation 2026 Party Frame (Live Video Overlay) -->
          <div class="pointer-events-none absolute inset-0 z-10 flex items-center justify-center">
            <img
              id="camera-frame-overlay"
              alt="Graduation 2026 Frame Overlay"
              class="h-full w-full object-contain pointer-events-none select-none"
            />
          </div>

          <!-- Camera Loading / Permission Message -->
          <div id="camera-status-msg" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center p-6 text-center text-sm text-neutral-400 hidden z-20">
            <svg class="h-8 w-8 text-neutral-500 mb-2 animate-spin-custom" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p id="camera-status-text">Accessing camera...</p>
          </div>
        </div>

        <!-- Camera Controls Toolbar -->
        <div class="relative z-20 flex h-28 shrink-0 items-center justify-around border-t border-neutral-800 bg-surface-850 px-6">
          <!-- Flip Camera Button -->
          <button
            id="flip-cam-btn"
            title="Switch Camera"
            class="flex h-11 w-11 items-center justify-center rounded-full border border-neutral-700 bg-surface-800 text-neutral-300 transition-transform active:scale-90"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
          </button>

          <!-- Main Shutter Button -->
          <div class="relative flex items-center justify-center">
            <button
              id="shutter-btn"
              class="group relative flex h-20 w-20 items-center justify-center rounded-full border-2 border-gold-500 p-1.5 transition-transform duration-100 active:scale-90"
            >
              <div class="h-full w-full rounded-full bg-gradient-to-tr from-gold-500 to-gold-300 shadow-md group-hover:brightness-110"></div>
            </button>
          </div>

          <!-- Switch User Button -->
          <button
            id="logout-btn"
            title="Switch Guest"
            class="flex h-11 w-11 items-center justify-center rounded-full border border-neutral-700 bg-surface-800 text-neutral-300 transition-transform active:scale-90"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- VIEW 3: UPLOAD / RESULT VIEW               -->
      <!-- ========================================== -->
      <section id="result-view" class="view-transition absolute inset-0 flex flex-col justify-between p-5 opacity-0 pointer-events-none z-0">
        <!-- Photo Preview Area (Displays photo with graduation frame composited) -->
        <div class="relative flex-1 overflow-hidden rounded-2xl border border-gold-500/20 bg-black flex items-center justify-center">
          <img
            id="captured-image-preview"
            alt="Captured Graduation Photo"
            class="h-full w-full object-contain"
          />

          <!-- Upload Status Pill (Floating over image) -->
          <div id="upload-status-card" class="absolute bottom-4 left-4 right-4 rounded-xl border border-neutral-800 bg-surface-850/95 p-3.5 shadow-xl transition-all duration-200">
            <!-- State 1: Uploading -->
            <div id="status-uploading" class="flex items-center space-x-3">
              <svg class="h-5 w-5 text-gold-400 animate-spin-custom shrink-0" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <div class="flex-1 overflow-hidden">
                <p class="text-xs font-semibold text-white">Saving to Google Drive...</p>
                <p class="text-[11px] text-neutral-400 truncate">Folder: <span id="target-folder-label" class="text-gold-400 font-medium"></span></p>
              </div>
            </div>

            <!-- State 2: Success -->
            <div id="status-success" class="hidden items-center space-x-3">
              <div class="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500/20 text-emerald-400 shrink-0">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                </svg>
              </div>
              <div class="flex-1 overflow-hidden">
                <p class="text-xs font-semibold text-emerald-400">Uploaded Successfully!</p>
                <a id="drive-link" href="#" target="_blank" class="text-[11px] text-gold-400 underline truncate block">
                  Open photo in Google Drive
                </a>
              </div>
            </div>

            <!-- State 3: Error / Fallback -->
            <div id="status-error" class="hidden items-center space-x-3">
              <div class="flex h-6 w-6 items-center justify-center rounded-full bg-rose-500/20 text-rose-400 shrink-0">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </div>
              <div class="flex-1 overflow-hidden">
                <p class="text-xs font-semibold text-rose-400">Upload Issue</p>
                <p id="error-details" class="text-[11px] text-neutral-400 truncate">Tap retry or save photo to your device</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Result Action Buttons -->
        <div class="mt-4 flex flex-col space-y-2.5">
          <div class="flex space-x-2">
            <!-- Retake / Next Photo -->
            <button
              id="retake-btn"
              class="flex-1 rounded-xl bg-gradient-to-r from-gold-600 via-gold-500 to-gold-400 py-3.5 text-xs font-bold uppercase tracking-wider text-black transition-transform duration-100 active:scale-95"
            >
              Take Another Photo
            </button>

            <!-- Manual Retry button (shown on error) -->
            <button
              id="retry-upload-btn"
              class="hidden rounded-xl border border-gold-500/40 bg-surface-800 px-4 py-3.5 text-xs font-semibold text-gold-400 transition-transform active:scale-95"
            >
              Retry
            </button>

            <!-- Direct Download Fallback -->
            <button
              id="download-fallback-btn"
              title="Save to Device"
              class="flex items-center justify-center rounded-xl border border-neutral-700 bg-surface-800 px-3.5 py-3.5 text-neutral-300 transition-transform active:scale-95"
            >
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
              </svg>
            </button>
          </div>

          <button
            id="finish-session-btn"
            class="w-full py-2 text-center text-xs text-neutral-400 hover:text-white transition-colors"
          >
            End Session &amp; Switch Guest
          </button>
        </div>
      </section>

    </main>

    <!-- Hidden Canvas for Crisp Image Composite Capture -->
    <canvas id="capture-canvas" class="hidden"></canvas>

  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    (() => {
      // =========================================================================
      // 1. HARDCODED BACKEND ENDPOINT
      // Directly hardcoded Google Apps Script Web App URL (Target Folder: 1e7wf16L5M2WGkywKuhhIfSCTi-eFnAvr)
      // =========================================================================
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGfU21xX6P7Jm5q-Photobooth_Graduation_Upload/exec";

      // =========================================================================
      // 2. TRANSPARENT GRADUATION 2026 PARTY FRAME OVERLAY (SVG / PNG GENERATOR)
      // Designed specifically for Graduation Party with "2026"
      // =========================================================================
      const GRADUATION_FRAME_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff2b2"/>
            <stop offset="25%" stop-color="#f6d365"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="75%" stop-color="#ab830a"/>
            <stop offset="100%" stop-color="#ffd976"/>
          </linearGradient>
          <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffea9f"/>
            <stop offset="100%" stop-color="#c99718"/>
          </linearGradient>
          <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.85"/>
          </filter>
        </defs>

        <!-- Outer Luxury Gold Border -->
        <rect x="28" y="28" width="1024" height="1384" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
        <rect x="42" y="42" width="996" height="1356" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 6" opacity="0.8" />
        
        <!-- Corner Ornaments with Starbursts -->
        <!-- Top Left -->
        <g transform="translate(30, 30)">
          <path d="M 0 65 L 0 0 L 65 0" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
          <circle cx="14" cy="14" r="5" fill="url(#goldGrad)"/>
          <polygon points="32,14 36,24 46,28 36,32 32,42 28,32 18,28 28,24" fill="url(#goldLight)"/>
        </g>
        <!-- Top Right -->
        <g transform="translate(1050, 30)">
          <path d="M 0 65 L 0 0 L -65 0" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
          <circle cx="-14" cy="14" r="5" fill="url(#goldGrad)"/>
          <polygon points="-32,14 -28,24 -18,28 -28,32 -32,42 -36,32 -46,28 -36,24" fill="url(#goldLight)"/>
        </g>
        <!-- Bottom Left -->
        <g transform="translate(30, 1410)">
          <path d="M 0 -65 L 0 0 L 65 0" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
          <circle cx="14" cy="-14" r="5" fill="url(#goldGrad)"/>
          <polygon points="32,-14 36,-24 46,-28 36,-32 32,-42 28,-32 18,-28 28,-24" fill="url(#goldLight)"/>
        </g>
        <!-- Bottom Right -->
        <g transform="translate(1050, 1410)">
          <path d="M 0 -65 L 0 0 L -65 0" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
          <circle cx="-14" cy="-14" r="5" fill="url(#goldGrad)"/>
          <polygon points="-32,-14 -28,-24 -18,-28 -28,-32 -32,-42 -36,-32 -46,-28 -36,-24" fill="url(#goldLight)"/>
        </g>

        <!-- TOP GRADUATION HEADER -->
        <g transform="translate(540, 95)" text-anchor="middle">
          <!-- Mortarboard Cap Silhouette with Tassel -->
          <path d="M 0 -32 L 48 -14 L 0 4 L -48 -14 Z" fill="url(#goldGrad)" filter="url(#shadowFilter)"/>
          <path d="M -26 -2 L -26 14 C -26 22 26 22 26 14 L 26 -2" fill="url(#goldGrad)" opacity="0.95"/>
          <path d="M 34 -9 C 38 0, 42 12, 44 24" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
          <circle cx="44" cy="26" r="3.5" fill="url(#goldGrad)"/>
          
          <!-- Header Titles -->
          <text y="34" font-family="'Times New Roman', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="8" fill="url(#goldGrad)" filter="url(#shadowFilter)">
            &#9733; CONGRATULATIONS &#9733;
          </text>
          <text y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="#ffffff" filter="url(#shadowFilter)">
            CLASS OF 2026
          </text>
        </g>

        <!-- BOTTOM CELEBRATION BANNER -->
        <!-- Subtle dark gold-bordered plaque ensuring readability over any user photo background -->
        <rect x="54" y="1225" width="972" height="165" rx="18" fill="#0a0a0f" fill-opacity="0.80" stroke="url(#goldGrad)" stroke-width="2" />

        <g transform="translate(540, 1272)" text-anchor="middle">
          <!-- Laurel Branches Left & Right -->
          <g stroke="url(#goldGrad)" fill="none" stroke-width="2.5">
            <path d="M -230 30 C -205 12, -180 5, -150 0"/>
            <path d="M 230 30 C 205 12, 180 5, 150 0"/>
          </g>
          <g fill="url(#goldGrad)">
            <circle cx="-195" cy="14" r="5"/>
            <circle cx="-170" cy="5" r="4.5"/>
            <circle cx="-145" cy="-2" r="4"/>
            <circle cx="195" cy="14" r="5"/>
            <circle cx="170" cy="5" r="4.5"/>
            <circle cx="145" cy="-2" r="4"/>
          </g>

          <!-- PROMINENT "2026" TEXT -->
          <text y="20" font-family="'Times New Roman', 'Georgia', serif" font-size="82" font-weight="900" letter-spacing="10" fill="url(#goldGrad)" filter="url(#shadowFilter)">
            2026
          </text>

          <!-- Church Name -->
          <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#ffffff" filter="url(#shadowFilter)">
            Church Of The Virgin Mary and St. Mina
          </text>
          <text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="url(#goldLight)">
            GRADUATION CELEBRATION
          </text>
        </g>
      </svg>`;

      // Convert SVG to data URI
      const GRADUATION_FRAME_DATA_URL = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(GRADUATION_FRAME_SVG.trim());

      // Preload Image for Canvas Compositing
      const frameImage = new Image();
      frameImage.crossOrigin = "anonymous";
      frameImage.src = GRADUATION_FRAME_DATA_URL;

      // Set live video frame overlay
      const cameraFrameOverlay = document.getElementById("camera-frame-overlay");
      cameraFrameOverlay.src = GRADUATION_FRAME_DATA_URL;

      // =========================================================================
      // 3. APPLICATION STATE & DOM REFERENCES
      // =========================================================================
      const state = {
        userName: "",
        stream: null,
        facingMode: "user", // "user" (front camera) or "environment" (rear camera)
        capturedBase64: null
      };

      const loginView = document.getElementById("login-view");
      const cameraView = document.getElementById("camera-view");
      const resultView = document.getElementById("result-view");

      const loginForm = document.getElementById("login-form");
      const userNameInput = document.getElementById("user-name-input");
      const headerUserTag = document.getElementById("header-user-tag");
      const headerUserName = document.getElementById("header-user-name");

      const video = document.getElementById("camera-stream");
      const shutterBtn = document.getElementById("shutter-btn");
      const flipCamBtn = document.getElementById("flip-cam-btn");
      const logoutBtn = document.getElementById("logout-btn");
      const shutterFlash = document.getElementById("shutter-flash-overlay");
      const canvas = document.getElementById("capture-canvas");
      const cameraStatusMsg = document.getElementById("camera-status-msg");
      const cameraStatusText = document.getElementById("camera-status-text");

      const previewImage = document.getElementById("captured-image-preview");
      const targetFolderLabel = document.getElementById("target-folder-label");
      const statusUploading = document.getElementById("status-uploading");
      const statusSuccess = document.getElementById("status-success");
      const statusError = document.getElementById("status-error");
      const errorDetails = document.getElementById("error-details");
      const driveLink = document.getElementById("drive-link");
      const retakeBtn = document.getElementById("retake-btn");
      const retryUploadBtn = document.getElementById("retry-upload-btn");
      const downloadFallbackBtn = document.getElementById("download-fallback-btn");
      const finishSessionBtn = document.getElementById("finish-session-btn");

      // =========================================================================
      // 4. SCREEN NAVIGATION
      // =========================================================================
      function showView(viewId) {
        [loginView, cameraView, resultView].forEach(v => {
          if (v.id === viewId) {
            v.classList.remove("opacity-0", "pointer-events-none", "z-0");
            v.classList.add("opacity-100", "z-10");
          } else {
            v.classList.remove("opacity-100", "z-10");
            v.classList.add("opacity-0", "pointer-events-none", "z-0");
          }
        });
      }

      // =========================================================================
      // 5. CAMERA STREAM MANAGEMENT
      // =========================================================================
      async function startCamera() {
        stopCamera();
        cameraStatusMsg.classList.remove("hidden");
        cameraStatusText.textContent = "Opening camera...";

        const constraints = {
          audio: false,
          video: {
            facingMode: state.facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        try {
          state.stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = state.stream;

          // Mirror video if front-facing for natural selfie view
          if (state.facingMode === "user") {
            video.classList.add("mirrored");
          } else {
            video.classList.remove("mirrored");
          }

          video.onloadedmetadata = () => {
            cameraStatusMsg.classList.add("hidden");
            video.play();
          };
        } catch (err) {
          console.error("Camera access error:", err);
          cameraStatusMsg.classList.remove("hidden");
          cameraStatusText.textContent = "Camera access denied. Please allow permissions in browser.";
        }
      }

      function stopCamera() {
        if (state.stream) {
          state.stream.getTracks().forEach(track => track.stop());
          state.stream = null;
        }
      }

      function flipCamera() {
        state.facingMode = state.facingMode === "user" ? "environment" : "user";
        startCamera();
      }

      // =========================================================================
      // 6. PHOTO CAPTURE & COMPOSITING (PHOTO FIRST, FRAME ON TOP)
      // =========================================================================
      function capturePhoto() {
        if (!state.stream) return;

        // Visual shutter flash effect
        shutterFlash.classList.remove("opacity-0");
        shutterFlash.classList.add("opacity-90");
        setTimeout(() => {
          shutterFlash.classList.remove("opacity-90");
          shutterFlash.classList.add("opacity-0");
        }, 90);

        // Determine resolution
        const width = video.videoWidth || 1080;
        const height = video.videoHeight || 1440;
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        // STEP 1: Draw the user's photo FIRST (with mirroring if front-facing)
        if (state.facingMode === "user") {
          ctx.save();
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, width, height);
          ctx.restore();
        } else {
          ctx.drawImage(video, 0, 0, width, height);
        }

        // STEP 2: Draw the Graduation 2026 Frame ON TOP of the photo
        ctx.drawImage(frameImage, 0, 0, width, height);

        // Convert the combined composition to Base64 JPEG
        const finalImage = canvas.toDataURL("image/jpeg", 0.90);
        state.capturedBase64 = finalImage;

        // Stop video stream to save mobile battery
        stopCamera();

        // Switch to result view
        previewImage.src = finalImage;
        targetFolderLabel.textContent = state.userName;
        showView("result-view");

        // Automatically trigger upload to Google Drive
        uploadPhotoToDrive();
      }

      // =========================================================================
      // 7. BACKGROUND GOOGLE DRIVE UPLOAD VIA APPS SCRIPT
      // =========================================================================
      async function uploadPhotoToDrive() {
        statusUploading.classList.remove("hidden");
        statusSuccess.classList.add("hidden");
        statusError.classList.add("hidden");
        retryUploadBtn.classList.add("hidden");

        try {
          const payload = {
            userName: state.userName,
            image: state.capturedBase64
          };

          /**
           * CRITICAL: Sending as "text/plain" avoids browser HTTP OPTIONS preflight
           * which Google Apps Script web apps do not support.
           */
          const response = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (result && result.status === "success") {
            statusUploading.classList.add("hidden");
            statusSuccess.classList.remove("hidden");
            statusError.classList.add("hidden");

            if (result.fileUrl) {
              driveLink.href = result.fileUrl;
              driveLink.textContent = "Open in Drive: " + (result.fileName || "View Photo");
            }
          } else {
            throw new Error((result && result.message) || "Failed to upload photo to Drive.");
          }

        } catch (error) {
          console.error("Upload error:", error);
          statusUploading.classList.add("hidden");
          statusSuccess.classList.add("hidden");
          statusError.classList.remove("hidden");
          retryUploadBtn.classList.remove("hidden");
          errorDetails.textContent = error.message || "Network error. Please try again.";
        }
      }

      // Save photo directly to device fallback
      function downloadPhotoLocally() {
        if (!state.capturedBase64) return;
        const link = document.createElement("a");
        const safeName = state.userName.replace(/[^a-zA-Z0-9]/g, "_");
        link.download = `${safeName}_Graduation_2026.jpg`;
        link.href = state.capturedBase64;
        link.click();
      }

      // =========================================================================
      // 8. EVENT LISTENERS
      // =========================================================================
      // Login Form Submit
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = userNameInput.value.trim();
        if (!name) return;

        state.userName = name;
        headerUserName.textContent = name;
        headerUserTag.classList.remove("hidden");
        headerUserTag.classList.add("flex");

        showView("camera-view");
        startCamera();
      });

      // Shutter Click
      shutterBtn.addEventListener("click", capturePhoto);

      // Flip Camera
      flipCamBtn.addEventListener("click", flipCamera);

      // Logout / Change User
      function logout() {
        stopCamera();
        state.userName = "";
        headerUserTag.classList.add("hidden");
        userNameInput.value = "";
        showView("login-view");
      }
      logoutBtn.addEventListener("click", logout);
      finishSessionBtn.addEventListener("click", logout);

      // Retake Photo
      retakeBtn.addEventListener("click", () => {
        showView("camera-view");
        startCamera();
      });

      // Retry Upload
      retryUploadBtn.addEventListener("click", uploadPhotoToDrive);

      // Download Fallback
      downloadFallbackBtn.addEventListener("click", downloadPhotoLocally);

    })();
  </script>
</body>
</html>
